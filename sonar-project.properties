# SonarQube 扫描入口配置（Maven 多模块项目）
sonar.projectKey=com.clara:clara
sonar.projectName=Clara
sonar.projectVersion=0.1.0-SNAPSHOT
sonar.sourceEncoding=UTF-8
sonar.java.source=8
sonar.java.target=8

# 只分析源码与测试源码，排除构建产物、本地工具目录与示例配置
sonar.exclusions=**/target/**,**/.m2/**,**/.local/**,**/logs/**,**/data/**,**/deploy/**
sonar.coverage.exclusions=**/src/test/**

# 等待质量门禁结果，便于 CI 直接失败
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600