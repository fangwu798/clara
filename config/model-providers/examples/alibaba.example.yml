# 阿里云脱敏样例：兼容模式与 DashScope 原生接口按能力分别配置。
# 平台标识。必须使用程序 ModelProvider 枚举中定义的 ALIBABA。
provider: ALIBABA

# 访问平台接口时使用的凭据配置。
credential:
  # 凭据逻辑名称，会传给 ProviderCredentialResolver；同一进程内应保持唯一且稳定。
  secretRef: alibaba-default
  # 保存 DashScope API Key 的环境变量名；程序启动前必须设置，不要提交真实密钥。
  environmentVariable: DASHSCOPE_API_KEY

# HTTP 连接、安全边界和报文大小限制。
transport:
  # 允许访问的服务源站白名单，仅填写“协议 + 主机 + 可选端口”。
  allowedOrigins:
    # DashScope 中国内地服务源站；国际站账号需按官方文档替换域名和各 endpoint。
    - https://dashscope.aliyuncs.com
  # 建立 TCP/TLS 连接的最长等待时间，单位为毫秒。
  connectTimeoutMillis: 3000
  # 读取模型响应的最长等待时间，单位为毫秒；异步任务完成时间不受此值控制。
  readTimeoutMillis: 60000
  # 单次请求体最大字节数；当前值为 16 MiB。
  maxRequestBytes: 16777216
  # 单次响应体最大字节数；当前值为 32 MiB。
  maxResponseBytes: 33554432
  # 是否允许 HTTP 明文地址；生产环境应保持 false。
  allowHttp: false

# 本平台启用的模型能力，不使用的能力节点可以删除。
capabilities:
  # 通过 OpenAI 兼容模式调用文本对话模型。
  chat:
    # DashScope OpenAI 兼容模式的 Chat Completions 完整接口地址。
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    # 实际调用的对话模型 ID，应替换为账号当前可用的模型名称。
    modelId: replace-with-chat-model-id
    # OpenAI 兼容对话协议适配器标识。
    apiProfile: openai-compatible-chat
    # 对话能力的默认请求参数。
    parameters:
      # 默认采样温度；具体有效范围及支持情况以所选模型文档为准。
      temperature: 0.7
      # 默认最大输出 Token 数，不应超过模型上限。
      maxTokens: 4096

  # DashScope 原生图片生成异步任务配置。
  image:
    # 创建图片生成任务的完整接口地址。
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/image-generation/generation
    # 查询异步任务状态的基础地址，运行时会按任务 ID 组装查询地址。
    taskQueryEndpoint: https://dashscope.aliyuncs.com/api/v1/tasks
    # 实际调用的图片生成模型 ID。
    modelId: replace-with-image-model-id
    # DashScope 原生图片任务协议适配器标识。
    apiProfile: dashscope-native-image
    # 图片任务输出信息及客户端限制。
    parameters:
      # 任务输出资源类型，必须为适配器支持的 IMAGE。
      outputType: IMAGE
      # 期望的图片 MIME 类型；需与模型实际返回格式一致。
      outputMimeType: image/png
      # 图片提示词允许的最大字符数。
      maxPromptChars: 32000
      # 单次请求允许附带的最大输入图片数量。
      maxInputImages: 4

  # DashScope 原生视频生成异步任务配置。
  video:
    # 创建视频生成任务的完整接口地址。
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis
    # 查询异步任务状态的基础地址，运行时会按任务 ID 组装查询地址。
    taskQueryEndpoint: https://dashscope.aliyuncs.com/api/v1/tasks
    # 实际调用的视频生成模型 ID。
    modelId: replace-with-video-model-id
    # DashScope 原生视频任务协议适配器标识。
    apiProfile: dashscope-native-video
    # 视频任务输出信息及客户端限制。
    parameters:
      # 任务输出资源类型，必须为适配器支持的 VIDEO。
      outputType: VIDEO
      # 期望的视频 MIME 类型；需与模型实际返回格式一致。
      outputMimeType: video/mp4
      # 视频提示词允许的最大字符数。
      maxPromptChars: 32000
      # 单次请求允许附带的最大输入图片数量。
      maxInputImages: 4

  # DashScope 原生音频转写能力配置。
  transcription:
    # 提交音频转写请求的完整接口地址。
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/audio/asr/transcription
    # 实际调用的语音识别模型 ID。
    modelId: replace-with-transcription-model-id
    # DashScope 原生语音识别协议适配器标识。
    apiProfile: dashscope-native-asr
    # 转写请求的客户端限制。
    parameters:
      # 附加提示或文本输入允许的最大字符数。
      maxTextChars: 8192

  # DashScope 原生语音合成能力配置。
  speech:
    # 提交语音合成请求的完整接口地址。
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
    # 实际调用的语音合成模型 ID。
    modelId: replace-with-speech-model-id
    # DashScope 原生语音合成协议适配器标识。
    apiProfile: dashscope-native-tts
    # 语音合成请求的客户端限制。
    parameters:
      # 待合成文本允许的最大字符数。
      maxTextChars: 4096
