# OpenAI 脱敏样例：复制到 ../local/openai.yml 后再填写真实模型 ID 和凭据来源。
# 平台标识。必须使用程序 ModelProvider 枚举中定义的 OPENAI。
provider: OPENAI

# 访问平台接口时使用的凭据配置。
credential:
  # 凭据逻辑名称，会传给 ProviderCredentialResolver；同一进程内应保持唯一且稳定。
  secretRef: openai-default
  # 保存 API Key 的环境变量名。程序启动前必须设置该变量，不要在此处填写真实密钥。
  # 如需使用仅限本机的明文密钥，应删除本项并在 local 文件中配置 apiKey。
  environmentVariable: OPENAI_API_KEY

# HTTP 连接、安全边界和报文大小限制。
transport:
  # 允许访问的服务源站白名单，仅填写“协议 + 主机 + 可选端口”，不要包含接口路径。
  allowedOrigins:
    # OpenAI 官方 API 源站；使用代理时应替换为代理的可信 HTTPS 源站。
    - https://api.openai.com
  # 建立 TCP/TLS 连接的最长等待时间，单位为毫秒。
  connectTimeoutMillis: 3000
  # 从服务端读取响应的最长等待时间，单位为毫秒；生成类模型可适当调大。
  readTimeoutMillis: 60000
  # 单次请求体最大字节数，超限请求会在发送前被拒绝。
  maxRequestBytes: 8388608
  # 单次响应体最大字节数，用于避免异常响应持续占用内存。
  maxResponseBytes: 33554432
  # 是否允许 HTTP 明文地址。生产环境应保持 false；设为 true 也必须匹配 allowedOrigins。
  allowHttp: false

# 本平台启用的模型能力；不使用的能力可以连同对应节点一起删除。
capabilities:
  # 文本对话能力配置。
  chat:
    # Chat Completions 完整接口地址，源站必须存在于 allowedOrigins 中。
    endpoint: https://api.openai.com/v1/chat/completions
    # 实际调用的对话模型 ID，应替换为账号当前可用的固定模型名称。
    modelId: replace-with-chat-model-id
    # 请求协议适配器标识；OpenAI Chat Completions 使用 chat-completions-v1。
    apiProfile: chat-completions-v1
    # 对话能力的默认请求参数和本地限制。
    parameters:
      # 默认采样温度；越低越稳定，具体有效范围以平台和模型文档为准。
      temperature: 0.7
      # 默认最大输出 Token 数，不应超过所选模型的输出上限。
      maxTokens: 4096

  # 文本向量化能力配置。
  embedding:
    # Embeddings 完整接口地址，源站必须存在于 allowedOrigins 中。
    endpoint: https://api.openai.com/v1/embeddings
    # 实际调用的向量模型 ID。
    modelId: replace-with-embedding-model-id
    # 请求协议适配器标识；OpenAI Embeddings 使用 embeddings-v1。
    apiProfile: embeddings-v1
    # 向量能力参数及客户端输入限制。
    parameters:
      # 返回向量的维度，必须与所选模型及后续向量库索引维度一致。
      dimension: 1536
      # 单次请求允许包含的最大文本条数。
      maxInputs: 64
      # 单条输入允许的最大字符数；这是客户端保护限制，不等同于 Token 数。
      maxTextChars: 8192
      # 单次请求所有输入文本合计允许的最大字符数。
      maxTotalChars: 65536

  # 图片生成能力配置。
  image:
    # Images Generations 完整接口地址。
    endpoint: https://api.openai.com/v1/images/generations
    # 实际调用的图片生成模型 ID。
    modelId: replace-with-image-model-id
    # 图片接口协议适配器标识。
    apiProfile: images-v1
    # 图片请求的客户端限制。
    parameters:
      # 图片提示词允许的最大字符数。
      maxTextChars: 32000
      # 输入媒体的最大字节数；当前值为 8 MiB。
      maxInputBytes: 8388608
      # 单次请求允许生成的最大结果数量。
      maxOutputs: 4

  # 音频转写能力配置。
  transcription:
    # Audio Transcriptions 完整接口地址。
    endpoint: https://api.openai.com/v1/audio/transcriptions
    # 实际调用的语音识别模型 ID。
    modelId: replace-with-transcription-model-id
    # 音频转写接口协议适配器标识。
    apiProfile: audio-transcriptions-v1
    # 转写请求的客户端限制。
    parameters:
      # 附加提示文本允许的最大字符数。
      maxTextChars: 8192
      # 上传音频允许的最大字节数；当前值为 25 MiB。
      maxInputBytes: 26214400
      # 单次请求允许返回的最大结果数量。
      maxOutputs: 1

  # 语音合成能力配置。
  speech:
    # Audio Speech 完整接口地址。
    endpoint: https://api.openai.com/v1/audio/speech
    # 实际调用的语音合成模型 ID。
    modelId: replace-with-speech-model-id
    # 语音合成接口协议适配器标识。
    apiProfile: audio-speech-v1
    # 语音合成请求的客户端限制。
    parameters:
      # 待合成文本允许的最大字符数。
      maxTextChars: 4096
      # 请求附带输入数据的最大字节数；当前值为 1 MiB。
      maxInputBytes: 1048576
      # 单次请求允许返回的最大音频结果数量。
      maxOutputs: 1
