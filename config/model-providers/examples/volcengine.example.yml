# 火山引擎脱敏样例：复制到 ../local/volcengine.yml 后按方舟区域和已开通能力修改地址及模型 ID。
# 平台标识。必须使用程序 ModelProvider 枚举中定义的 VOLCENGINE。
provider: VOLCENGINE

# 访问平台接口时使用的凭据配置。
credential:
  # 凭据逻辑名称，会传给 ProviderCredentialResolver；同一进程内应保持唯一且稳定。
  secretRef: volcengine-default
  # 保存 API Key 的环境变量名；程序启动前必须设置，不要提交真实密钥。
  environmentVariable: VOLCENGINE_API_KEY

# HTTP 连接、安全边界和报文大小限制。
transport:
  # 允许访问的服务源站白名单，仅填写“协议 + 主机 + 可选端口”。
  allowedOrigins:
    # 火山方舟北京区域源站；其他区域或代理部署应同步修改此项和各 endpoint。
    - https://ark.cn-beijing.volces.com
  # 建立 TCP/TLS 连接的最长等待时间，单位为毫秒。
  connectTimeoutMillis: 3000
  # 读取模型响应的最长等待时间，单位为毫秒；视频任务通常异步提交，不代表任务完成时间。
  readTimeoutMillis: 60000
  # 单次请求体最大字节数；当前值为 16 MiB。
  maxRequestBytes: 16777216
  # 单次响应体最大字节数；当前值为 32 MiB。
  maxResponseBytes: 33554432
  # 是否允许 HTTP 明文地址；生产环境应保持 false。
  allowHttp: false

# 本平台启用的模型能力，不使用的能力节点可以删除。
capabilities:
  # 文本对话能力配置。
  chat:
    # 方舟 Chat Completions 完整接口地址，源站必须存在于 allowedOrigins 中。
    endpoint: https://ark.cn-beijing.volces.com/api/v3/chat/completions
    # 实际调用的推理接入点 ID 或模型 ID，以方舟控制台显示值为准。
    modelId: replace-with-chat-endpoint-or-model-id
    # 方舟 V3 对话接口的协议适配器标识。
    apiProfile: ark-v3-chat
    # 对话能力的默认请求参数。
    parameters:
      # 默认采样温度；具体有效范围及支持情况以所选模型文档为准。
      temperature: 0.7
      # 默认最大输出 Token 数，不应超过模型上限。
      maxTokens: 4096

  # 图片生成能力配置。
  image:
    # 方舟 Images Generations 完整接口地址。
    endpoint: https://ark.cn-beijing.volces.com/api/v3/images/generations
    # 图片模型对应的推理接入点 ID 或模型 ID。
    modelId: replace-with-image-endpoint-or-model-id
    # 方舟 V3 图片接口的协议适配器标识。
    apiProfile: ark-v3-images
    # 图片请求参数及客户端保护限制。
    parameters:
      # 图片提示词允许的最大字符数。
      maxPromptChars: 32000
      # 单次请求允许生成的最大图片数量。
      maxImages: 4
      # 单次请求允许附带的最大参考图片数量。
      maxSourceImages: 4
      # 是否默认在生成图片中添加平台水印；合规要求优先于本地配置。
      watermark: false

  # 视频生成异步任务配置。
  video:
    # 创建视频生成任务的完整接口地址。
    endpoint: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
    # 视频模型对应的推理接入点 ID 或模型 ID。
    modelId: replace-with-video-endpoint-or-model-id
    # 方舟 V3 内容生成任务的协议适配器标识。
    apiProfile: ark-v3-content-tasks
    # 视频任务参数及客户端保护限制。
    parameters:
      # 视频提示词允许的最大字符数。
      maxPromptChars: 32000
      # 单次任务允许附带的最大参考图片数量。
      maxReferenceImages: 4
