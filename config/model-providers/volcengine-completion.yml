provider: VOLCENGINE
credential:
  secretRef: volcengine
  # apiKey: xxx
  environmentVariable: CLARA_VOLCENGINE_API_KEY
transport:
  allowedOrigins:
    - https://ark.cn-beijing.volces.com
  connectTimeoutMillis: 10000
  readTimeoutMillis: 600000
  maxRequestBytes: 16777216
  maxResponseBytes: 33554432
  allowHttp: false
capabilities:
  CHAT:
    endpoint: https://ark.cn-beijing.volces.com/api/v3/chat/completions
    modelId: doubao-seed-2-1-pro-260628
    apiProfile: ark-v3-chat
    parameters:
      # 豆包 Seed 2.1 Pro：上下文 256K，最大回答 256K tokens
      maxTokens: 262144
