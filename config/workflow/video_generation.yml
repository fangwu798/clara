workflowId: video_generation
description: 文生视频（必填 subject，可选 reference）：先生成提示词并等待人工确认，只有明确批准后才调用视频生成；产物下载到 .clara/media/videos
version: "1.2.1"
outputs: [prompt, video]
inputSchema:
  type: object
  required: [subject]
  properties:
    subject:
      type: string
      description: 视频主题与画面内容（必填）
    reference:
      type: string
      description: 可选参考图（公开图片 URL 或 data URL），用于图生视频
root:
  id: root
  type: SEQUENCE
  children:
    - id: refine
      type: AGENT
      outputKeys: [prompt]
      capability: CHAT
      prompt: video_generator
      promptVars:
        subject: "${subject}"
    - id: review_prompt
      type: HUMAN
      inputKey: promptFeedback
    - id: confirmation
      type: CONDITION
      condition:
        key: promptFeedback
        operator: equals
        value: approve
      whenTrue:
        id: generate
        type: AGENT
        outputKeys: [video]
        model: volcengine-response
        capability: VIDEO
        prompt: video_render
        promptVars:
          prompt: "${prompt}"
        attachments:
          - "${reference?}"
      whenFalse:
        id: revise_and_review
        type: SEQUENCE
        children:
          - id: revise
            type: AGENT
            outputKeys: [prompt]
            capability: CHAT
            prompt: video_generator
            promptVars:
              subject: "${subject}"
              feedback: "${promptFeedback}"
          - id: review_prompt_again
            type: HUMAN
            inputKey: promptFeedbackAgain
          - id: confirm_again
            type: CONDITION
            condition:
              key: promptFeedbackAgain
              operator: equals
              value: approve
            whenTrue:
              id: generate_after_feedback
              type: AGENT
              outputKeys: [video]
              model: volcengine-response
              capability: VIDEO
              prompt: video_render
              promptVars:
                prompt: "${prompt}"
              attachments:
                - "${reference?}"
