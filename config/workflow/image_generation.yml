workflowId: image_generation
description: 文生图，按主题生成图片
version: "1.2.0"
outputs: [prompt, image]
root:
  id: root
  type: SEQUENCE
  children:
    - id: refine
      type: AGENT
      outputKeys: [prompt]
      capability: CHAT
      prompt: image_generator
      promptVars:
        subject: "${subject}"
    - id: review_prompt
      type: HUMAN
      inputKey: promptFeedback
    - id: confirmation
      type: CONDITION
      condition:
        key: promptFeedback
        operator: equals
        value: approve
      whenTrue:
        id: draw
        type: AGENT
        outputKeys: [image]
        model: volcengine-response
        capability: IMAGE
        prompt: image_render
        promptVars:
          prompt: "${prompt}"
      whenFalse:
        id: revise_and_review
        type: SEQUENCE
        children:
          - id: revise
            type: AGENT
            outputKeys: [prompt]
            capability: CHAT
            prompt: image_generator
            promptVars:
              subject: "${subject}"
              feedback: "${promptFeedback}"
          - id: review_prompt_again
            type: HUMAN
            inputKey: promptFeedbackAgain
          - id: draw_after_feedback
            type: AGENT
            outputKeys: [image]
            model: volcengine-response
            capability: IMAGE
            prompt: image_render
            promptVars:
              prompt: "${prompt}"
