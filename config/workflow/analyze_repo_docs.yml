workflowId: analyze_repo_docs
description: 扫描当前目录并整理技术文档
version: "1.0.0"
# 对外只回传最终文档，避免把批量读取的源码内容整体回灌给对话模型。
outputs: [document]
root:
  id: root
  type: SEQUENCE
  children:
    - id: scan
      type: TOOL
      outputKeys: [scan_result]
      tool: file_ops
      arguments:
        op: scan
        base_dir: "."
        include: ["*.md", "*.java", "*.xml", "*.yml", "*.yaml", "*.json", "*.py"]
        max_files: 300
        max_depth: 6
        with_size: true
    - id: plan
      type: AGENT
      outputKeys: [plan]
      prompt: repo_doc_planner
      promptVars:
        goal: "梳理并输出本项目（Clara 智能体平台）的技术文档"
        listing: "${scan_result}"
    # 先把当前工作目录导入代码知识图谱（幂等、秒回）：已导入只回一句「已就绪」，没导入就后台发起索引，
    # 不让分钟级的索引卡住流程。想让图谱立刻覆盖全量代码时，也可以先跑
    # deploy/codebase-memory-mcp/index-workdir.ps1（见同目录 readme.md）。
    - id: graph
      type: TOOL
      outputKeys: [graph]
      tool: code_graph
      arguments:
        op: prepare
        base_dir: "."
        index: true
        purpose: "把当前工作目录导入代码知识图谱（未索引则后台建索引）"
    # 读取计划挑出的文件：code_graph 逐文件先取知识图谱的文件大纲，图谱未覆盖（未索引 / 不在索引范围 /
    # 图谱不可用）的才回退为本地文件读取，返回里每条信息都带 source(graph|file)，便于核对信息来源。
    - id: read
      type: TOOL
      outputKeys: [sources]
      tool: code_graph
      arguments:
        op: read
        base_dir: "."
        paths: "${plan.files}"
        max_bytes: 6000
        purpose: "读取计划挑出的源码与文档：优先取代码知识图谱，图谱未覆盖的再读本地文件"
    - id: draft
      type: AGENT
      outputKeys: [document]
      prompt: repo_doc_writer
      promptVars:
        goal: "梳理并输出本项目（Clara 智能体平台）的技术文档"
        plan: "${plan}"
        sources: "${sources}"
