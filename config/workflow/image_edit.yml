workflowId: image_edit
description: 图生图：根据参考图片和编辑指令生成图片
version: "1.1.0"
# 对外只回传图片资产引用。
outputs: [image]
root:
  id: root
  type: SEQUENCE
  children:
    # 先用对话模型把用户的编辑要求收敛成一句可执行的画面指令，再交给图片模型。
    - id: refine
      type: AGENT
      outputKeys: [prompt]
      capability: CHAT
      prompt: image_editor
      promptVars:
        instruction: "${instruction}"
    # 主模型用 OpenAI gpt-image-2（multipart /v1/images/edits，成本低于火山 Seedream）；
    # 失败时回退火山。reference 支持公网 URL、data URI 与本地文件路径（宿主会先转 data URI）。
    - id: edit
      type: AGENT
      outputKeys: [image]
      model: openai
      fallbackModel: volcengine-response
      capability: IMAGE
      prompt: image_render
      promptVars:
        prompt: "${prompt}"
      attachments:
        - "${reference}"
