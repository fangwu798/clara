<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 756" width="1240" height="756" font-family="'Segoe UI Variable','Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/><stop offset="0.55" stop-color="#F5F8FC"/><stop offset="1" stop-color="#F2F6FB"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BFD3EC"/><stop offset="1" stop-color="#E4EDF7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#AFC3DB" opacity="0.42"/>
    </pattern>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="142%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.2" flood-color="#22324A" flood-opacity="0.075"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8A9AAE"/></marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#64748B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3B82F6"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10B981"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F59E0B"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8B5CF6"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F43F5E"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="756" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1240" height="756" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="1240" height="4" fill="url(#topLine)"/>
  <g>
    <rect x="50" y="17" width="154" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <circle cx="65" cy="29" r="3.2" fill="#2563EB"/>
    <text x="75" y="33" font-size="9.6" font-weight="700" fill="#2563EB" letter-spacing="1.25">CLARA · LEARNING</text>
    <rect x="1084" y="17" width="106" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <text x="1137" y="33" font-size="9.6" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">CHAPTER 13</text>
  </g>
  <rect x="36" y="51" width="4" height="28" rx="2" fill="#2563EB"/>
  <text x="50" y="68" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="0.2">扩展开发地图</text>
  <text x="50" y="90" font-size="12.6" font-weight="400" fill="#64748B">先判断“这是配置问题、脚本问题，还是实现问题”，再选择改动位置。</text>
  <line x1="50" y1="104" x2="1190" y2="104" stroke="url(#divider)" stroke-width="1"/>
  <g transform="translate(0,28)">
  <rect x="60" y="100" width="500" height="140" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="113.0" width="3" height="114.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="74" y="123" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">新增模型平台</text><text x="74" y="141" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">1. 新增 config/model-providers/&lt;alias&gt;.yml</text><text x="74" y="156" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">2. 选择已有 protocol / apiProfile</text><text x="74" y="171" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">3. 如字段差异大，补注解适配器</text><text x="74" y="186" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">4. 用直接调用示例验证</text><rect x="620" y="100" width="500" height="140" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="620.5" y="113.0" width="3" height="114.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="634" y="123" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">新增工具</text><text x="634" y="141" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">1. 写 Python / Shell / JS 脚本</text><text x="634" y="156" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">2. 实现 --describe 与 stdin/stdout</text><text x="634" y="171" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">3. 放进 config/skill/scripts</text><text x="634" y="186" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">4. 用模型调用验证</text><rect x="60" y="270" width="500" height="140" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="283.0" width="3" height="114.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="74" y="293" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">新增提示词</text><text x="74" y="311" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">1. 新建 config/skill/prompt/&lt;id&gt;.json</text><text x="74" y="326" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">2. 填 id / description / segments</text><text x="74" y="341" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">3. 工作流 prompt 或 alwaysPrompts 引用</text><text x="74" y="356" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">4. 验证检索命中</text><rect x="620" y="270" width="500" height="140" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="620.5" y="283.0" width="3" height="114.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="634" y="293" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">新增工作流</text><text x="634" y="311" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">1. 写 config/workflow/custom/&lt;id&gt;.yml</text><text x="634" y="326" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">2. 用 publish_workflow 或手工校验</text><text x="634" y="341" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">3. 通过 run_workflow 调用</text><text x="634" y="356" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">4. 检查 HUMAN / 变量 / 输出键</text><rect x="60" y="440" width="500" height="140" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="453.0" width="3" height="114.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="74" y="463" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">新增 MCP 服务</text><text x="74" y="481" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">1. 在 config/mcp/*.json 注册</text><text x="74" y="496" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">2. stdio 或 url + headers</text><text x="74" y="511" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">3. 启动后检查能力目录</text><text x="74" y="526" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">4. 通过 CompositeToolInvoker 调用</text><rect x="620" y="440" width="500" height="140" rx="12" fill="#FFF3F4" stroke="#EBC7CA" filter="url(#cardShadow)" stroke-width="1" /><rect x="620.5" y="453.0" width="3" height="114.0" rx="1.5" fill="#F43F5E" opacity="0.9"/><text x="634" y="463" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">替换记忆 / 观测实现</text><text x="634" y="481" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">1. 实现 ISemanticMemoryStore / ConversationStore</text><text x="634" y="496" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">2. 或实现 ITelemetrySink</text><text x="634" y="511" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">3. 在 ApplicationBootstrap 注入</text><text x="634" y="526" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">4. 跑契约测试与集成测试</text><rect x="60" y="620" width="1100" height="64" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="633.0" width="3" height="38.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="74" y="643" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">扩展原则</text><text x="74" y="661" font-size="11.25" font-weight="400" fill="#1E293B" text-anchor="start">优先用配置和脚本扩展；只有协议差异、存储实现或观测后端变化时才改 Java 接口实现。</text>
</g>
  <line x1="50" y1="702" x2="1190" y2="702" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="739" font-size="10.8" font-weight="400" fill="#7C8DA6">图 13-1 扩展开发地图：先判断扩展类型，再选择改动位置。</text>
  <text x="1190" y="739" font-size="9.4" font-weight="600" fill="#A6B4C7" text-anchor="end" letter-spacing="1.1">CLARA · LEARNING MANUAL</text>
</svg>
