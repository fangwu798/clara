    <text x="882" y="333" font-size="9.2" font-weight="700" fill="#2563EB" text-anchor="middle">5</text>
    <text x="900" y="333" font-size="11.6" fill="#334155">最后读 12–14，复盘与扩展</text><rect x="850" y="410" width="340" height="200" rx="14" fill="#FFF9EE" stroke="#F1D9B0" filter="url(#cardShadow)"/>
  <text x="874" y="440" font-size="15" font-weight="700" fill="#B45309">每章怎么读</text>
  <text x="874" y="468" font-size="11.6" fill="#334155">先看目标与配图，建立心智模型。</text>
  <text x="874" y="496" font-size="11.6" fill="#334155">再按“关键类 + 调用顺序”读源码。</text>
  <text x="874" y="524" font-size="11.6" fill="#334155">最后做练习，用 rg / 测试验证。</text>
  <line x1="874" y1="546" x2="1166" y2="546" stroke="#F1D9B0" stroke-width="1"/>
  <text x="874" y="570" font-size="10.8" fill="#8A6A3B">读不懂实现时，先回到第 3 章的契约边界。</text><rect x="850" y="632" width="340" height="94" rx="14" fill="#F2FBF5" stroke="#CBE8D3" filter="url(#cardShadow)"/>
  <text x="874" y="660" font-size="14" font-weight="700" fill="#047857">先跑起来</text>
  <text x="874" y="684" font-size="10.4" fill="#334155" font-family="Consolas,monospace">mvn -pl clara-application -am package</text>
  <text x="874" y="702" font-size="10.4" fill="#334155" font-family="Consolas,monospace">java -jar clara.jar</text>
  
  <line x1="50" y1="762" x2="1190" y2="762" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="783" font-size="10.8" font-weight="400" fill="#7C8DA6">图 0-1 学习路线：从全局到局部，再回到一条完整请求链路。</text>
