    <text x="900" y="197" font-size="11.6" fill="#334155">先读 01–02，把项目跑起来</text>
    <circle cx="882" cy="227" r="9" fill="#EAF2FF"/>
    <text x="882" y="231" font-size="9.2" font-weight="700" fill="#2563EB" text-anchor="middle">2</text>
    <text x="900" y="231" font-size="11.6" fill="#334155">再读 03–05，理解一次模型调用</text>
    <circle cx="882" cy="261" r="9" fill="#EAF2FF"/>
    <text x="882" y="265" font-size="9.2" font-weight="700" fill="#2563EB" text-anchor="middle">3</text>
    <text x="900" y="265" font-size="11.6" fill="#334155">接着读 06–08，理解状态与工具</text>
    <circle cx="882" cy="295" r="9" fill="#EAF2FF"/>
    <text x="882" y="299" font-size="9.2" font-weight="700" fill="#2563EB" text-anchor="middle">4</text>
    <text x="900" y="299" font-size="11.6" fill="#334155">然后读 09–11，串起执行链路</text>
