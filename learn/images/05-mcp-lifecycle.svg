<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 696" width="1240" height="696" font-family="'Segoe UI Variable','Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/><stop offset="0.55" stop-color="#F5F8FC"/><stop offset="1" stop-color="#F2F6FB"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BFD3EC"/><stop offset="1" stop-color="#E4EDF7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#AFC3DB" opacity="0.42"/>
    </pattern>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="142%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.2" flood-color="#22324A" flood-opacity="0.075"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8A9AAE"/></marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#64748B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3B82F6"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10B981"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F59E0B"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8B5CF6"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F43F5E"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="696" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1240" height="696" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="1240" height="4" fill="url(#topLine)"/>
  <g>
    <rect x="50" y="17" width="154" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <circle cx="65" cy="29" r="3.2" fill="#2563EB"/>
    <text x="75" y="33" font-size="9.6" font-weight="700" fill="#2563EB" letter-spacing="1.25">CLARA · LEARNING</text>
    <rect x="1084" y="17" width="106" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <text x="1137" y="33" font-size="9.6" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">CHAPTER 07</text>
  </g>
  <rect x="36" y="51" width="4" height="28" rx="2" fill="#2563EB"/>
  <text x="50" y="68" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="0.2">MCP 生命周期：从配置到可调用工具</text>
  <text x="50" y="90" font-size="12.6" font-weight="400" fill="#64748B">MCP 的复杂度不在调用，而在“发现、注册、能力目录、传输”四段。</text>
  <line x1="50" y1="104" x2="1190" y2="104" stroke="url(#divider)" stroke-width="1"/>
  <g transform="translate(0,28)">
  <rect x="60" y="82" width="1120" height="44" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="95.0" width="3" height="18.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="74" y="105" font-size="11.25" font-weight="700" fill="#0F766E" text-anchor="start">MCP 是可选能力：没有 config/mcp/*.json 或所有服务都不可用时，应用仍可正常对话，只是没有外部工具。</text><rect x="60" y="160" width="200" height="82" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="173.0" width="3" height="56.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="74" y="183" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">config/mcp/*.json</text><text x="74" y="201" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">mcpServers 注册表</text><line x1="260" y1="201" x2="300" y2="201" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="160" width="200" height="82" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="300.5" y="173.0" width="3" height="56.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="314" y="183" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">DirectoryLoader</text><text x="314" y="201" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">递归扫描 + 合并覆盖</text><line x1="500" y1="201" x2="540" y2="201" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="160" width="200" height="82" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="540.5" y="173.0" width="3" height="56.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="554" y="183" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">Registrar</text><text x="554" y="201" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">转换为 McpServerRegistration</text><line x1="740" y1="201" x2="780" y2="201" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="780" y="160" width="200" height="82" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="780.5" y="173.0" width="3" height="56.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="794" y="183" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">ServerRegistry</text><text x="794" y="201" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">保存服务状态与传输方式</text><line x1="880" y1="242" x2="880" y2="290" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="780" y="290" width="200" height="88" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="780.5" y="303.0" width="3" height="62.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="794" y="313" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">DiscoveryService</text><text x="794" y="331" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">initialize 握手</text><text x="794" y="346" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">列出 tools / prompts / resources</text><line x1="780" y1="334" x2="740" y2="334" stroke="#047857" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="290" width="200" height="88" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="540.5" y="303.0" width="3" height="62.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="554" y="313" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">CapabilityCatalog</text><text x="554" y="331" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">工具、提示词、资源描述</text><line x1="540" y1="334" x2="500" y2="334" stroke="#047857" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="290" width="200" height="88" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="300.5" y="303.0" width="3" height="62.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="314" y="313" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">ExternalToolCatalog</text><text x="314" y="331" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">包装成统一工具条目</text><line x1="300" y1="334" x2="260" y2="334" stroke="#047857" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="290" width="200" height="88" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="303.0" width="3" height="62.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="74" y="313" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">CompositeToolInvoker</text><text x="74" y="331" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">本地技能优先，MCP 兜底</text><rect x="60" y="440" width="530" height="120" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="453.0" width="3" height="94.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="74" y="463" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">传输方式一：stdio</text><text x="74" y="481" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">command + args 启动子进程；env 注入环境变量；</text><text x="74" y="496" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">适合本地 CLI 型 MCP 服务；</text><text x="74" y="511" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">典型：docker exec -i &lt;容器&gt; &lt;mcp-binary&gt;</text><rect x="650" y="440" width="530" height="120" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="650.5" y="453.0" width="3" height="94.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="664" y="463" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">传输方式二：Streamable HTTP</text><text x="664" y="481" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">url + headers 直接访问远程服务；</text><text x="664" y="496" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">headers 支持 ${VAR} 环境变量插值；</text><text x="664" y="511" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">适合平台化 / 远程共享的 MCP 服务。</text><line x1="325" y1="378" x2="325" y2="440" stroke="#B45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><line x1="915" y1="378" x2="915" y2="440" stroke="#6D28D9" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="610" font-size="10.4" font-weight="400" fill="#94A3B8" text-anchor="start">协议要点：JSON-RPC 请求 / 响应 / 通知；initialize 后先发现能力，再把 MCP 工具并入统一工具目录。</text>
</g>
  <line x1="50" y1="642" x2="1190" y2="642" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="679" font-size="10.8" font-weight="400" fill="#7C8DA6">图 7-1 MCP 生命周期：从配置到可调用工具。</text>
  <text x="1190" y="679" font-size="9.4" font-weight="600" fill="#A6B4C7" text-anchor="end" letter-spacing="1.1">CLARA · LEARNING MANUAL</text>
</svg>
