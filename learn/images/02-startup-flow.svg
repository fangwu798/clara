<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 786" width="1240" height="786" font-family="'Segoe UI Variable','Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/><stop offset="0.55" stop-color="#F5F8FC"/><stop offset="1" stop-color="#F2F6FB"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BFD3EC"/><stop offset="1" stop-color="#E4EDF7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#AFC3DB" opacity="0.42"/>
    </pattern>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="142%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.2" flood-color="#22324A" flood-opacity="0.075"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8A9AAE"/></marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#64748B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3B82F6"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10B981"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F59E0B"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8B5CF6"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F43F5E"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="786" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1240" height="786" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="1240" height="4" fill="url(#topLine)"/>
  <g>
    <rect x="50" y="17" width="154" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <circle cx="65" cy="29" r="3.2" fill="#2563EB"/>
    <text x="75" y="33" font-size="9.6" font-weight="700" fill="#2563EB" letter-spacing="1.25">CLARA · LEARNING</text>
    <rect x="1084" y="17" width="106" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <text x="1137" y="33" font-size="9.6" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">CHAPTER 02</text>
  </g>
  <rect x="36" y="51" width="4" height="28" rx="2" fill="#2563EB"/>
  <text x="50" y="68" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="0.2">启动流程：从命令到可对话状态</text>
  <text x="50" y="90" font-size="12.6" font-weight="400" fill="#64748B">启动不是“读一个配置文件”，而是配置定位、模型探测、依赖装配和交互循环的组合。</text>
  <line x1="50" y1="104" x2="1190" y2="104" stroke="url(#divider)" stroke-width="1"/>
  <g transform="translate(0,28)">
  <rect x="60" y="92" width="700" height="72" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="105.0" width="3" height="46.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="74" y="115" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">1. 解析启动参数</text><text x="74" y="133" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">LaunchOptions 读取 --config、日志与颜色参数</text><line x1="410" y1="164" x2="410" y2="180" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="180" width="700" height="72" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="193.0" width="3" height="46.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="74" y="203" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">2. 定位并读取配置</text><text x="74" y="221" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ConfigLocator 从当前目录向上回溯 config/</text><line x1="410" y1="252" x2="410" y2="268" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="268" width="700" height="72" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="281.0" width="3" height="46.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="74" y="291" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">3. 模型可用性探测</text><text x="74" y="309" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ModelAvailabilityManager 并发探测，逐个输出可用 / 不可用</text><line x1="410" y1="340" x2="410" y2="356" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="356" width="700" height="72" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="369.0" width="3" height="46.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="74" y="379" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">4. 选择默认模型</text><text x="74" y="397" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">defaultModel → enabledProviders → 手动选择</text><line x1="410" y1="428" x2="410" y2="444" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="444" width="700" height="72" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="457.0" width="3" height="46.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="74" y="467" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">5. 装配 ApplicationBootstrap</text><text x="74" y="485" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ModelRegistry、Memory、Skill、MCP、Workflow、Telemetry</text><line x1="410" y1="516" x2="410" y2="532" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="532" width="700" height="72" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="545.0" width="3" height="46.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="74" y="555" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">6. 加载 MCP 与代码图谱</text><text x="74" y="573" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">可选；MCP 未配置时跳过，图谱未部署时不影响启动</text><line x1="410" y1="604" x2="410" y2="620" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="620" width="700" height="72" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="633.0" width="3" height="46.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="74" y="643" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">7. 进入交互循环</text><text x="74" y="661" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ConsoleView + SessionCommandHandler 处理输入与内置命令</text><rect x="800" y="92" width="390" height="210" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="800.5" y="105.0" width="3" height="184.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="814" y="115" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">启动阶段的关键产物</text><text x="814" y="133" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ProviderConfiguration：平台 / 端点 / 能力</text><text x="814" y="148" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ModelRegistry：当前模型与切换入口</text><text x="814" y="163" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ApplicationBootstrap：所有能力的装配点</text><text x="814" y="178" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">ConsoleView：输入、颜色、日志、状态行</text><rect x="800" y="326" width="390" height="210" rx="12" fill="#FFF3F4" stroke="#EBC7CA" filter="url(#cardShadow)" stroke-width="1" /><rect x="800.5" y="339.0" width="3" height="184.0" rx="1.5" fill="#F43F5E" opacity="0.9"/><text x="814" y="349" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">常见启动失败点</text><text x="814" y="367" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">config/ 不在当前目录及其父目录中</text><text x="814" y="382" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">defaultModel 不在 enabledProviders 内</text><text x="814" y="397" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">模型凭据环境变量缺失或无效</text><text x="814" y="412" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">MCP 配置引用未定义的环境变量</text><text x="814" y="427" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">Milvus / 图谱未启动（可选能力）</text><rect x="800" y="560" width="390" height="150" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="800.5" y="573.0" width="3" height="124.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="814" y="583" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">验证命令</text><text x="814" y="601" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">mvn -pl clara-application -am package -DskipTests</text><text x="814" y="616" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">java -Dfile.encoding=UTF-8 -jar clara.jar</text><text x="814" y="631" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">在交互内执行 /init 重新探测并装配</text>
</g>
  <line x1="50" y1="732" x2="1190" y2="732" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="769" font-size="10.8" font-weight="400" fill="#7C8DA6">图 2-1 启动流程：从命令到可对话状态。</text>
  <text x="1190" y="769" font-size="9.4" font-weight="600" fill="#A6B4C7" text-anchor="end" letter-spacing="1.1">CLARA · LEARNING MANUAL</text>
</svg>
