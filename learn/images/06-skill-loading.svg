<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 656" width="1240" height="656" font-family="'Segoe UI Variable','Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/><stop offset="0.55" stop-color="#F5F8FC"/><stop offset="1" stop-color="#F2F6FB"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BFD3EC"/><stop offset="1" stop-color="#E4EDF7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#AFC3DB" opacity="0.42"/>
    </pattern>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="142%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.2" flood-color="#22324A" flood-opacity="0.075"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8A9AAE"/></marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#64748B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3B82F6"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10B981"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F59E0B"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8B5CF6"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F43F5E"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="656" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1240" height="656" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="1240" height="4" fill="url(#topLine)"/>
  <g>
    <rect x="50" y="17" width="154" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <circle cx="65" cy="29" r="3.2" fill="#2563EB"/>
    <text x="75" y="33" font-size="9.6" font-weight="700" fill="#2563EB" letter-spacing="1.25">CLARA · LEARNING</text>
    <rect x="1084" y="17" width="106" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <text x="1137" y="33" font-size="9.6" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">CHAPTER 08</text>
  </g>
  <rect x="36" y="51" width="4" height="28" rx="2" fill="#2563EB"/>
  <text x="50" y="68" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="0.2">技能加载与执行</text>
  <text x="50" y="90" font-size="12.6" font-weight="400" fill="#64748B">先分清 prompt、tool、script 三类文件，再看它们如何合并成模型可见的能力。</text>
  <line x1="50" y1="104" x2="1190" y2="104" stroke="url(#divider)" stroke-width="1"/>
  <g transform="translate(0,28)">
  <rect x="50" y="92" width="300" height="110" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="50.5" y="105.0" width="3" height="84.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="64" y="115" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">内置技能</text><text x="64" y="133" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">classpath: resource/config</text><text x="64" y="148" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">随应用发布，保证开箱可用</text><rect x="50" y="230" width="300" height="110" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="50.5" y="243.0" width="3" height="84.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="64" y="253" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">运行期技能</text><text x="64" y="271" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">config/skill</text><text x="64" y="286" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">可覆盖内置同名 id，支持热加载</text><rect x="410" y="150" width="260" height="150" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="410.5" y="163.0" width="3" height="124.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="424" y="173" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">SkillRegistry</text><text x="424" y="191" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">扫描 prompt/、tools/、scripts/</text><text x="424" y="206" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">合并来源，同名覆盖</text><text x="424" y="221" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">按文件签名刷新</text><line x1="350" y1="147" x2="410" y2="190" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><line x1="350" y1="285" x2="410" y2="260" stroke="#B45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><rect x="730" y="92" width="460" height="92" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="730.5" y="105.0" width="3" height="66.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="744" y="115" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">PromptDefinition</text><text x="744" y="133" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">id / description / segments</text><text x="744" y="148" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">进入 SkillMatchCoordinator，按输入相似度检索</text><rect x="730" y="202" width="460" height="92" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="730.5" y="215.0" width="3" height="66.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="744" y="225" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">ToolMethod</text><text x="744" y="243" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">id / name / type / parameters / script</text><text x="744" y="258" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">合并成工具目录，供模型声明与调用</text><line x1="670" y1="200" x2="730" y2="140" stroke="#6D28D9" stroke-width="1.8" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/><line x1="670" y1="240" x2="730" y2="248" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="360" width="260" height="120" rx="12" fill="#FFF3F4" stroke="#EBC7CA" filter="url(#cardShadow)" stroke-width="1" /><rect x="410.5" y="373.0" width="3" height="94.0" rx="1.5" fill="#F43F5E" opacity="0.9"/><text x="424" y="383" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">ScriptToolLoader</text><text x="424" y="401" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">执行 python script.py --describe</text><text x="424" y="416" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">stdout JSON → ToolMethod</text><text x="424" y="431" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">失败 / 非工具脚本则跳过</text><line x1="540" y1="300" x2="540" y2="360" stroke="#BE123C" stroke-width="1.8" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="380" width="300" height="120" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="50.5" y="393.0" width="3" height="94.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="64" y="403" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">脚本工具</text><text x="64" y="421" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">stdin JSON 入参</text><text x="64" y="436" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">stdout JSON 结果</text><text x="64" y="451" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">PYTHONUTF8 / PYTHONDONTWRITEBYTECODE</text><line x1="350" y1="440" x2="410" y2="420" stroke="#B45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><rect x="730" y="360" width="460" height="150" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="730.5" y="373.0" width="3" height="124.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="744" y="383" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">执行链</text><text x="744" y="401" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">SkillExecutor → SchemaValidator → PermissionAuthorizer</text><text x="744" y="416" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">→ ScriptExecutorRegistry → Python / Shell / JS / BUILTIN</text><text x="744" y="431" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">结果统一包装为 ToolResult 回到编排层</text><line x1="670" y1="420" x2="730" y2="420" stroke="#047857" stroke-width="1.8" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="570" font-size="10.4" font-weight="400" fill="#94A3B8" text-anchor="start">技能 = 提示词 + 工具声明 + 执行体。提示词决定“怎么用”，工具声明决定“能调用什么”，执行器决定“怎么跑”。</text>
</g>
  <line x1="50" y1="602" x2="1190" y2="602" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="639" font-size="10.8" font-weight="400" fill="#7C8DA6">图 8-1 技能加载与执行：提示词、工具声明与脚本执行器。</text>
  <text x="1190" y="639" font-size="9.4" font-weight="600" fill="#A6B4C7" text-anchor="end" letter-spacing="1.1">CLARA · LEARNING MANUAL</text>
</svg>
