  <rect x="330" y="86" width="580" height="64" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="330.5" y="99.0" width="3" height="38.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="344" y="109" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">clara-application</text><text x="344" y="127" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">装配入口 · 交互式 CLI · 配置 / 图谱 / 观测接入</text><rect x="330" y="184" width="580" height="64" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="330.5" y="197.0" width="3" height="38.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="344" y="207" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">clara-orchestration</text><text x="344" y="225" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">对话主循环 · 上下文装配 · 工具往返 · 意图计划</text><line x1="620" y1="150" x2="620" y2="184" stroke="#B45309" stroke-width="1.8" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="310" width="190" height="96" rx="12" fill="#EAF0FB" stroke="#C9D6F0" filter="url(#cardShadow)" stroke-width="1" /><rect x="58.5" y="323.0" width="3" height="70.0" rx="1.5" fill="#94A3B8" opacity="0.9"/><text x="72" y="333" font-size="13.5" font-weight="700" fill="#28407A" text-anchor="start">clara-model</text><text x="72" y="351" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">Provider 配置 / 协议适配</text><text x="72" y="366" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">流式调用 / 媒体 / Token</text><line x1="620" y1="248" x2="153" y2="310" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="310" width="190" height="96" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="264.5" y="323.0" width="3" height="70.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="278" y="333" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">clara-memory</text><text x="278" y="351" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">窗口记忆 / 会话持久化</text><text x="278" y="366" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">语义召回 / 摘要</text><line x1="620" y1="248" x2="359" y2="310" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="310" width="190" height="96" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="470.5" y="323.0" width="3" height="70.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="484" y="333" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">clara-skill</text><text x="484" y="351" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">提示词 / 工具声明</text><text x="484" y="366" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">脚本执行 / 权限校验</text><line x1="620" y1="248" x2="565" y2="310" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="676" y="310" width="190" height="96" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="676.5" y="323.0" width="3" height="70.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="690" y="333" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">clara-mcp</text><text x="690" y="351" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">MCP 客户端</text><text x="690" y="366" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">stdio / HTTP 传输</text><line x1="620" y1="248" x2="771" y2="310" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="882" y="310" width="190" height="96" rx="12" fill="#FFF3F4" stroke="#EBC7CA" filter="url(#cardShadow)" stroke-width="1" /><rect x="882.5" y="323.0" width="3" height="70.0" rx="1.5" fill="#F43F5E" opacity="0.9"/><text x="896" y="333" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">clara-workflow</text><text x="896" y="351" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">工作流定义 / DAG</text><text x="896" y="366" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">人工确认 / 多角色评审</text><line x1="620" y1="248" x2="977" y2="310" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="470" width="300" height="84" rx="12" fill="#F2F4F7" stroke="#D5DAE2" filter="url(#cardShadow)" stroke-width="1" /><rect x="140.5" y="483.0" width="3" height="58.0" rx="1.5" fill="#94A3B8" opacity="0.9"/><text x="154" y="493" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">clara-core</text><text x="154" y="511" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">契约接口 · DTO · 枚举</text><text x="154" y="526" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">结构化错误 · 通用模型</text><rect x="470" y="470" width="300" height="84" rx="12" fill="#F2F4F7" stroke="#D5DAE2" filter="url(#cardShadow)" stroke-width="1" /><rect x="470.5" y="483.0" width="3" height="58.0" rx="1.5" fill="#94A3B8" opacity="0.9"/><text x="484" y="493" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">clara-transport</text><text x="484" y="511" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">HTTP / SSE 传输</text><text x="484" y="526" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">超时 / 体积上限 / 有界流</text><rect x="800" y="470" width="260" height="84" rx="12" fill="#F2F4F7" stroke="#D5DAE2" filter="url(#cardShadow)" stroke-width="1" /><rect x="800.5" y="483.0" width="3" height="58.0" rx="1.5" fill="#94A3B8" opacity="0.9"/><text x="814" y="493" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">clara-bom</text><text x="814" y="511" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">版本清单</text><text x="814" y="526" font-size="10.8" font-weight="400" fill="#64748B" text-anchor="start">依赖治理</text><line x1="153" y1="406" x2="350" y2="470" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><line x1="359" y1="406" x2="350" y2="470" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><line x1="565" y1="406" x2="350" y2="470" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><line x1="771" y1="406" x2="350" y2="470" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><line x1="977" y1="406" x2="350" y2="470" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="610" font-size="10.4" font-weight="400" fill="#94A3B8" text-anchor="start">依赖方向：application → orchestration → 能力模块 → core / transport。能力模块之间只通过 core 契约交互。</text><text x="40" y="632" font-size="10.4" font-weight="400" fill="#94A3B8" text-anchor="start">MCP 是可选模块：未配置 MCP 服务时，应用仍可使用内置技能 / 工具运行。</text><rect x="140" y="660" width="920" height="64" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="140.5" y="673.0" width="3" height="38.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="154" y="683" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">设计原则</text><text x="154" y="701" font-size="11.25" font-weight="400" fill="#1E293B" text-anchor="start">契约先行：业务模块不直接依赖实现；平台差异通过配置 + 注解适配，而不是在调用方写 if/else。</text>
</g>
  <line x1="50" y1="742" x2="1190" y2="742" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="779" font-size="10.8" font-weight="400" fill="#7C8DA6">图 1-1 模块依赖与分层：能力模块只依赖 core 契约。</text>
