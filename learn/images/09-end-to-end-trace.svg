  <g>
    <rect x="50" y="17" width="154" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <circle cx="65" cy="29" r="3.2" fill="#2563EB"/>
    <text x="75" y="33" font-size="9.6" font-weight="700" fill="#2563EB" letter-spacing="1.25">CLARA · LEARNING</text>
    <rect x="1084" y="17" width="106" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <text x="1137" y="33" font-size="9.6" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">CHAPTER 12</text>
  </g>
  <rect x="36" y="51" width="4" height="28" rx="2" fill="#2563EB"/>
  <text x="50" y="68" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="0.2">端到端请求追踪</text>
  <text x="50" y="90" font-size="12.6" font-weight="400" fill="#64748B">把前 11 章的知识落到一条真实链路上：输入、装配、模型、工具、结果、观测。</text>
  <line x1="50" y1="104" x2="1190" y2="104" stroke="url(#divider)" stroke-width="1"/>
  <g transform="translate(0,28)">
  <rect x="50" y="110" width="160" height="84" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="50.5" y="123.0" width="3" height="58.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="64" y="133" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">1. CLI 输入</text><text x="64" y="151" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ConsoleView</text><text x="64" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">读取一行</text><line x1="210" y1="152" x2="230" y2="152" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="230" y="110" width="160" height="84" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="230.5" y="123.0" width="3" height="58.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="244" y="133" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">2. 命令 / 对话</text><text x="244" y="151" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">SessionCommandHandler</text><text x="244" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">内置命令或进入对话</text><line x1="390" y1="152" x2="410" y2="152" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="110" width="160" height="84" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="410.5" y="123.0" width="3" height="58.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="424" y="133" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">3. 编排</text><text x="424" y="151" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Orchestrator</text><text x="424" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">创建本轮状态</text><line x1="570" y1="152" x2="590" y2="152" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="110" width="160" height="84" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="590.5" y="123.0" width="3" height="58.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="604" y="133" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">4. 上下文</text><text x="604" y="151" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ContextAssembler</text><text x="604" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">窗口 + 摘要 + 召回</text><line x1="750" y1="152" x2="770" y2="152" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="770" y="110" width="160" height="84" rx="12" fill="#EAF0FB" stroke="#C9D6F0" filter="url(#cardShadow)" stroke-width="1" /><rect x="770.5" y="123.0" width="3" height="58.0" rx="1.5" fill="#94A3B8" opacity="0.9"/><text x="784" y="133" font-size="13.5" font-weight="700" fill="#28407A" text-anchor="start">5. 模型调用</text><text x="784" y="151" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">CompatibleStream</text><text x="784" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">编码 / 流式</text><line x1="930" y1="152" x2="950" y2="152" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="950" y="110" width="160" height="84" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="950.5" y="123.0" width="3" height="58.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="964" y="133" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">6. 传输</text><text x="964" y="151" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Jdk8HttpTransport</text><text x="964" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">HTTP / SSE</text><rect x="950" y="260" width="160" height="84" rx="12" fill="#FFF3F4" stroke="#EBC7CA" filter="url(#cardShadow)" stroke-width="1" /><rect x="950.5" y="273.0" width="3" height="58.0" rx="1.5" fill="#F43F5E" opacity="0.9"/><text x="964" y="283" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">7. 模型平台</text><text x="964" y="301" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">OpenAI / DeepSeek</text><text x="964" y="316" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Kimi / 火山 / 通义</text><line x1="1030" y1="194" x2="1030" y2="260" stroke="#BE123C" stroke-width="1.8" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="260" width="300" height="84" rx="12" fill="#F2FBF5" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="590.5" y="273.0" width="3" height="58.0" rx="1.5" fill="#10B981" opacity="0.9"/><text x="604" y="283" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">工具 / 工作流分支（可选）</text><text x="604" y="301" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">tool_calls → ToolRoundTrip</text><text x="604" y="316" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">run_workflow → WorkflowRunner</text><line x1="590" y1="194" x2="590" y2="260" stroke="#047857" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/><line x1="890" y1="302" x2="950" y2="302" stroke="#047857" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><line x1="1030" y1="344" x2="1030" y2="420" stroke="#64748B" stroke-width="1.2"/><line x1="1030" y1="420" x2="130" y2="420" stroke="#64748B" stroke-width="1.2"/><line x1="130" y1="420" x2="130" y2="194" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="470" width="1000" height="90" rx="12" fill="#F3F7FF" stroke="#C9DCF7" filter="url(#cardShadow)" stroke-width="1" /><rect x="130.5" y="483.0" width="3" height="64.0" rx="1.5" fill="#3B82F6" opacity="0.9"/><text x="144" y="493" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="start">结果回传</text><text x="144" y="511" font-size="11.25" font-weight="400" fill="#1E293B" text-anchor="start">ConversationResult → ConsoleView（正文 / 思考 / 工具往返 / token / 错误）→ 写入记忆与用量台账</text><rect x="50" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="50.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="64" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">conversation.turn</text><rect x="210" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="210.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="224" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">intent.plan</text><rect x="370" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="370.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="384" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">context.window</text><rect x="510" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="510.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="524" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">context.skill</text><rect x="650" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="650.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="664" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">context.recall</text><rect x="800" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="800.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="814" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">tool.roundtrip</text><rect x="950" y="610" width="140" height="46" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="950.5" y="623.0" width="3" height="20.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="964" y="633" font-size="9.9" font-weight="700" fill="#6D28D9" text-anchor="start">model.call</text><text x="50" y="695" font-size="10.4" font-weight="400" fill="#94A3B8" text-anchor="start">可观测：每一轮会产生 Span（阶段 / 耗时 / token / 状态），/trace 可回看最近链路；工具和模型失败会在 Span 上标记错误。</text>
</g>
  <line x1="50" y1="722" x2="1190" y2="722" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="759" font-size="10.8" font-weight="400" fill="#7C8DA6">图 12-1 端到端请求追踪：一条真实请求经过的每个阶段。</text>
  <text x="1190" y="759" font-size="9.4" font-weight="600" fill="#A6B4C7" text-anchor="end" letter-spacing="1.1">CLARA · LEARNING MANUAL</text>
</svg>
