<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 796" width="1240" height="796" font-family="'Segoe UI Variable','Segoe UI','Microsoft YaHei UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/><stop offset="0.55" stop-color="#F5F8FC"/><stop offset="1" stop-color="#F2F6FB"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BFD3EC"/><stop offset="1" stop-color="#E4EDF7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#AFC3DB" opacity="0.42"/>
    </pattern>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="142%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.2" flood-color="#22324A" flood-opacity="0.075"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8A9AAE"/></marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#64748B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3B82F6"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#10B981"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F59E0B"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#8B5CF6"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#F43F5E"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="796" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1240" height="796" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="1240" height="4" fill="url(#topLine)"/>
  <g>
    <rect x="50" y="17" width="154" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <circle cx="65" cy="29" r="3.2" fill="#2563EB"/>
    <text x="75" y="33" font-size="9.6" font-weight="700" fill="#2563EB" letter-spacing="1.25">CLARA · LEARNING</text>
    <rect x="1084" y="17" width="106" height="24" rx="12" fill="#FFFFFF" stroke="#D7E4F3" stroke-width="1"/>
    <text x="1137" y="33" font-size="9.6" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">CHAPTER 11</text>
  </g>
  <rect x="36" y="51" width="4" height="28" rx="2" fill="#2563EB"/>
  <text x="50" y="68" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="0.2">应用入口：交互主循环与可观测</text>
  <text x="50" y="90" font-size="12.6" font-weight="400" fill="#64748B">ClaraApplication 负责“把输入接到编排、把过程画到终端”；可观测把这些过程变成可查询的 Span 与指标。</text>
  <line x1="50" y1="104" x2="1190" y2="104" stroke="url(#divider)" stroke-width="1"/>
  <g transform="translate(0,28)">

  <rect x="40" y="78" width="1160" height="272" rx="10" fill="#F8FBF8" stroke="#C9E7D2"/>
  <text x="58" y="104" font-size="14" font-weight="700" fill="#047857" text-anchor="start">A. 交互主循环：输入、命令、编排、渲染</text>

  <rect x="58" y="122" width="180" height="78" rx="12" fill="#FFFFFF" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="58.5" y="135.0" width="3" height="52.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="72" y="146" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">ConsoleInput</text>
  <text x="72" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">JLine 读取一行</text>
  <text x="72" y="182" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">历史 / 多行 / ESC</text>
  <line x1="238" y1="161" x2="268" y2="161" stroke="#047857" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="268" y="122" width="190" height="78" rx="12" fill="#FFFFFF" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="268.5" y="135.0" width="3" height="52.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="282" y="146" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">SessionCommandHandler</text>
  <text x="282" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">/model /init /usage</text>
  <text x="282" y="182" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">/history /graph /trace</text>
  <line x1="458" y1="161" x2="488" y2="161" stroke="#047857" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="488" y="122" width="190" height="78" rx="12" fill="#FFFFFF" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="488.5" y="135.0" width="3" height="52.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="502" y="146" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">ClaraApplication</text>
  <text x="502" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">模型选择 / 故障切换</text>
  <text x="502" y="182" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">会话 ID / 中断 / 收尾</text>
  <line x1="678" y1="161" x2="708" y2="161" stroke="#047857" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="708" y="122" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="708.5" y="135.0" width="3" height="52.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="722" y="146" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">DefaultConversationOrchestrator</text>
  <text x="722" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Agent Loop</text>
  <text x="722" y="182" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">上下文 / 工具 / 结果</text>
  <line x1="908" y1="161" x2="938" y2="161" stroke="#047857" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="938" y="122" width="244" height="78" rx="12" fill="#FFFFFF" stroke="#C9E7D2" filter="url(#cardShadow)" stroke-width="1" /><rect x="938.5" y="135.0" width="3" height="52.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="952" y="146" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">ConsoleView</text>
  <text x="952" y="166" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">思考 / 正文 / 工具浅蓝</text>
  <text x="952" y="182" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">人工确认黄色 / 错误红色</text>

  <rect x="58" y="220" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6" filter="url(#cardShadow)" stroke-width="1" /><rect x="58.5" y="233.0" width="3" height="84.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="72" y="244" font-size="10.8" font-weight="700" fill="#475569" text-anchor="start">启动阶段</text>
  <text x="72" y="264" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ConfigLocator → ModelRegistry</text>
  <text x="72" y="280" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ModelAvailabilityManager 探活</text>
  <text x="72" y="296" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ApplicationBootstrap 装配</text>
  <text x="72" y="312" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">loadMcpServers → 工具目录</text>

  <rect x="414" y="220" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6" filter="url(#cardShadow)" stroke-width="1" /><rect x="414.5" y="233.0" width="3" height="84.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="428" y="244" font-size="10.8" font-weight="700" fill="#475569" text-anchor="start">轮次阶段</text>
  <text x="428" y="264" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ConversationRequest 绑定 provider/model</text>
  <text x="428" y="280" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">StreamingToolCallObserver 实时回显</text>
  <text x="428" y="296" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">UserInterventionBuffer 执行期干预</text>
  <text x="428" y="312" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Result → 历史落盘 / 用量台账</text>

  <rect x="770" y="220" width="412" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6" filter="url(#cardShadow)" stroke-width="1" /><rect x="770.5" y="233.0" width="3" height="84.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="784" y="244" font-size="10.8" font-weight="700" fill="#475569" text-anchor="start">为什么要独立出 adapter.console</text>
  <text x="784" y="264" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">CLI 只是一个宿主：颜色、日志、命令解析、终端热键</text>
  <text x="784" y="280" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">都不应该污染编排层；换 Web / REST 宿主时直接复用</text>
  <text x="784" y="296" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">ApplicationBootstrap + ConversationRequest，而不是另写一遍</text>
  <text x="784" y="312" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Agent Loop。ConsoleView 只负责 Renderer 职责。</text>

  <rect x="40" y="372" width="1160" height="260" rx="10" fill="#FBF7FD" stroke="#DEC9F1"/>
  <text x="58" y="398" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="start">B. 可观测：一条请求如何变成 Span、指标与导出</text>

  <rect x="58" y="416" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="58.5" y="429.0" width="3" height="44.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="72" y="440" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="start">Telemetry</text>
  <text x="72" y="460" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">startSpan / currentContext</text>
  <text x="72" y="476" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">线程内父子关系</text>
  <line x1="238" y1="451" x2="268" y2="451" stroke="#6D28D9" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="268" y="416" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="268.5" y="429.0" width="3" height="44.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="282" y="440" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="start">CompositeTelemetrySink</text>
  <text x="282" y="460" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">指标先收，采样后分流</text>
  <text x="282" y="476" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">错误 / 慢请求始终保留</text>
  <line x1="478" y1="451" x2="508" y2="451" stroke="#6D28D9" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="508" y="416" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="508.5" y="429.0" width="3" height="44.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="522" y="440" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="start">TelemetryMetrics</text>
  <text x="522" y="460" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">计数 / 直方图 / 耗时</text>
  <text x="522" y="476" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">→ Prometheus /metrics</text>
  <line x1="698" y1="451" x2="728" y2="451" stroke="#6D28D9" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="728" y="416" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="728.5" y="429.0" width="3" height="44.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="742" y="440" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="start">TelemetryStore</text>
  <text x="742" y="460" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">内存最近 Span</text>
  <text x="742" y="476" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">JSONL 落盘 / /trace</text>
  <line x1="918" y1="451" x2="948" y2="451" stroke="#6D28D9" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="948" y="416" width="234" height="70" rx="12" fill="#FFFFFF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="948.5" y="429.0" width="3" height="44.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="962" y="440" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="start">OtlpHttpTelemetrySink</text>
  <text x="962" y="460" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">OTLP/HTTP → Collector</text>
  <text x="962" y="476" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">Tempo / Grafana</text>

  <rect x="58" y="506" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#DDE1E6" filter="url(#cardShadow)" stroke-width="1" /><rect x="58.5" y="519.0" width="3" height="78.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="72" y="530" font-size="10.8" font-weight="700" fill="#475569" text-anchor="start">Span 树（简化）</text>
  <text x="72" y="550" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">conversation.turn</text>
  <text x="92" y="568" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">├─ context.assemble</text>
  <text x="92" y="586" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">├─ model.call（含首字符耗时）</text>
  <text x="92" y="604" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">└─ tool.roundtrip（可多次）</text>

  <rect x="442" y="506" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#DDE1E6" filter="url(#cardShadow)" stroke-width="1" /><rect x="442.5" y="519.0" width="3" height="78.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="456" y="530" font-size="10.8" font-weight="700" fill="#475569" text-anchor="start">用量与调用记录</text>
  <text x="456" y="550" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">CallRecordPublisher → InMemoryCallRecordSink</text>
  <text x="456" y="568" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">TokenUsage → 消息持久化 → /usage</text>
  <text x="456" y="586" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">CapabilityUsageLedger → 图片 / 视频 / 图谱</text>
  <text x="456" y="604" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">图谱查询单独计量，不混入文本 token</text>

  <rect x="826" y="506" width="356" height="104" rx="8" fill="#FFFFFF" stroke="#DDE1E6" filter="url(#cardShadow)" stroke-width="1" /><rect x="826.5" y="519.0" width="3" height="78.0" rx="1.5" fill="#94A3B8" opacity="0.9"/>
  <text x="840" y="530" font-size="10.8" font-weight="700" fill="#475569" text-anchor="start">排查顺序</text>
  <text x="840" y="550" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">1. /trace 看最近一轮 Span 树</text>
  <text x="840" y="568" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">2. /usage 看 token 与平台分布</text>
  <text x="840" y="586" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">3. 启动横幅看模型 / MCP / 图谱状态</text>
  <text x="840" y="604" font-size="9.9" font-weight="400" fill="#64748B" text-anchor="start">4. 日志文件看完整异常与请求上下文</text>

  <rect x="40" y="652" width="1160" height="72" rx="12" fill="#F3F7FF" stroke="#C9DCF7"/>
  <text x="58" y="676" font-size="12.2" font-weight="700" fill="#1D4ED8" text-anchor="start">关键设计取舍</text>
  <text x="58" y="698" font-size="10.8" font-weight="400" fill="#1E293B" text-anchor="start">控制台只做展示，不做业务判断；观测只在边界埋点，不记录提示词正文。这样换宿主、换后端都不需要改能力模块。</text>
  
</g>
  <line x1="50" y1="742" x2="1190" y2="742" stroke="#DCE6F1" stroke-width="1"/>
  <text x="50" y="779" font-size="10.8" font-weight="400" fill="#7C8DA6">图 11-1 应用入口与可观测：交互链路与追踪指标通过 conversation.turn 关联。</text>
  <text x="1190" y="779" font-size="9.4" font-weight="600" fill="#A6B4C7" text-anchor="end" letter-spacing="1.1">CLARA · LEARNING MANUAL</text>
</svg>
