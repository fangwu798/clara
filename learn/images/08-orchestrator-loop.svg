oke-width="1" /><rect x="360.5" y="403.0" width="3" height="48.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="374" y="413" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">装配上下文</text><text x="374" y="431" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">ContextAssembler.assemble</text><line x1="530" y1="464" x2="530" y2="490" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="490" width="340" height="74" rx="12" fill="#EAF0FB" stroke="#C9D6F0" filter="url(#cardShadow)" stroke-width="1" /><rect x="360.5" y="503.0" width="3" height="48.0" rx="1.5" fill="#94A3B8" opacity="0.9"/><text x="374" y="513" font-size="13.5" font-weight="700" fill="#28407A" text-anchor="start">调用模型</text><text x="374" y="531" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">CompatibleStream.chat</text><line x1="530" y1="564" x2="530" y2="590" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="590" width="340" height="74" rx="12" fill="#FFF3F4" stroke="#EBC7CA" filter="url(#cardShadow)" stroke-width="1" /><rect x="360.5" y="603.0" width="3" height="48.0" rx="1.5" fill="#F43F5E" opacity="0.9"/><text x="374" y="613" font-size="13.5" font-weight="700" fill="#BE123C" text-anchor="start">有 tool_calls？</text><text x="374" y="631" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">是 → 工具往返</text><text x="374" y="646" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">否 → 返回结果</text><line x1="700" y1="627" x2="790" y2="627" stroke="#BE123C" stroke-width="1.8" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="580" width="300" height="94" rx="12" fill="#EFFBF8" stroke="#C4E4E0" filter="url(#cardShadow)" stroke-width="1" /><rect x="790.5" y="593.0" width="3" height="68.0" rx="1.5" fill="#14B8A6" opacity="0.9"/><text x="804" y="603" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">ToolRoundTripCoordinator</text><text x="804" y="621" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">执行工具并回填结果</text><text x="804" y="636" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">最多 maxToolRoundTrips 次</text><line x1="940" y1="580" x2="940" y2="527" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><line x1="940" y1="490" x2="700" y2="490" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="390" width="250" height="170" rx="12" fill="#F8F3FF" stroke="#DEC9F1" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="403.0" width="3" height="144.0" rx="1.5" fill="#8B5CF6" opacity="0.9"/><text x="74" y="413" font-size="13.5" font-weight="700" fill="#6D28D9" text-anchor="start">装配输入</text><text x="74" y="431" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">窗口消息</text><text x="74" y="446" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">历史压缩摘要</text><text x="74" y="461" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">技能提示词 / 工具</text><text x="74" y="476" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">代码图谱补充</text><text x="74" y="491" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">语义召回</text><line x1="310" y1="475" x2="360" y2="475" stroke="#6D28D9" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="90" width="250" height="220" rx="12" fill="#FFF8EC" stroke="#F1D6AC" filter="url(#cardShadow)" stroke-width="1" /><rect x="60.5" y="103.0" width="3" height="194.0" rx="1.5" fill="#F59E0B" opacity="0.9"/><text x="74" y="113" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">循环中的安全阀</text><text x="74" y="131" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">取消令牌：ESC 两次</text><text x="74" y="146" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">输出截断：继续生成</text><text x="74" y="161" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">上下文超限：压缩后重发</text><text x="74" y="176" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">工具参数不完整：拒绝执行</text><text x="74" y="191" font-size="10.4" font-weight="400" fill="#64748B" text-anchor="start">执行期补充：下一轮注入</text><line x1="310" y1="200" x2="360" y2="200" stroke="#B45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="700" font-size="10.4" font-weight="400" fill="#94A3B8" text-anchor="start">最终结果：ConversationResult(content, reasoning, usage, status, toolRoundTrips, pausedForUserInput)。</text>
</g>
