name: publish

# 发布到 GitHub Packages（Maven）。触发方式：
#   1) 推送版本标签（例如 v1.0.1 或 1.0.1）后自动发布；
#   2) Actions 页面手动 Run workflow。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # 标签触发时用标签作为发布版本（v1.0.1 / 1.0.1 -> 1.0.1），避免手工改 pom。
      - name: Use tag as release version
        if: startsWith(github.ref, 'refs/tags/')
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # deploy 会先跑完整测试（CI 中没有模型凭据，联调用例自动跳过），测试不过不会发布。
      - name: Publish to GitHub Packages
        run: mvn -B -Pgithub deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把可执行 clara.jar 附到 Release，免去使用者本地构建；重复执行时覆盖同名附件。
      - name: Attach CLI jar to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" clara.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" clara.jar --title "$GITHUB_REF_NAME" --generate-notes
          fi
