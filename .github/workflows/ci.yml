name: ci

# 构建与测试门禁：push / PR 都跑一遍完整 verify。
# 标签触发的发布由 publish.yml 负责，这里忽略标签避免重复执行。
on:
  push:
    branches: [master]
    tags-ignore: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      # 集成测试在依赖服务不可达时自动跳过（Assume），无需额外配置。
      - name: Build and test
        run: mvn -B verify

      # 与 deploy/coverage/check-coverage.mjs 的团队标准保持一致：整体行覆盖率不低于 80%。
      - name: Check coverage
        run: node deploy/coverage/check-coverage.mjs 0.80
