<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <title>Clara 后续改进计划 · 三批演进路线 </title>
  <rect x="0" y="0" width="1400" height="860" fill="#FFFFFF"/>

  <text x="44" y="60" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#2E3440">Clara 后续改进计划 · 三批演进路线 </text>
  <text x="44" y="86" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11" fill="#5A6577">阶段按时间递进，箭头表示演进方向；底部警示栏列出上线前必须消除的风险与依赖。 </text>
  <line x1="44" y1="100" x2="1356" y2="100" stroke="#E1E7EF" stroke-width="1"/>

