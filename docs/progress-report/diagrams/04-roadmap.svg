  <text x="74" y="609" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">基于真实任务产出汇报 demo：对话 </text>
  <text x="74" y="625" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">/ 工作流 / 生图 / 代码图谱 </text>

  <rect x="497" y="108" width="405" height="560" rx="10" fill="#F3F8FD" stroke="#C6DDF2" stroke-width="1.5"/>
  <path d="M497,152 L497,118 Q497,108 507,108 L892,108 Q902,108 902,118 L902,152 Z" fill="#2B6CB0"/>
  <text x="513" y="136" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">中期（1-2 月）· 从能用到好用 </text>

  <rect x="509" y="168" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="510" y="180" width="3.5" height="69" rx="1.75" fill="#2B6CB0"/>
  <text x="527" y="200.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">生产级状态持久化 </text>
  <text x="527" y="217.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">检查点、预算台账、媒体任务从内存 </text>
  <text x="527" y="233.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">实现替换为共享存储 </text>

  <rect x="509" y="298.5" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="510" y="310.5" width="3.5" height="69" rx="1.75" fill="#2B6CB0"/>
