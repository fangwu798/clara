  <text x="527" y="356" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">更多工具接入 + 工具权限与审批策略 </text>

  <rect x="509" y="429" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="510" y="441" width="3.5" height="69" rx="1.75" fill="#2B6CB0"/>
  <text x="527" y="469.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">工作流可视化 </text>
  <text x="527" y="486.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">运行轨迹、节点耗时与失败原因可回看 </text>

  <rect x="509" y="559.5" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="510" y="571.5" width="3.5" height="69" rx="1.75" fill="#2B6CB0"/>
  <text x="527" y="600" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">性能与成本 </text>
  <text x="527" y="617" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">上下文压缩、Token 预算与成本看板 </text>

  <rect x="950" y="108" width="405" height="560" rx="10" fill="#EAF0FB" stroke="#5B7FCB" stroke-width="1.5"/>
  <path d="M950,152 L950,118 Q950,108 960,108 L1345,108 Q1355,108 1355,118 L1355,152 Z" fill="#28407A"/>
  <text x="966" y="136" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">长期· 走向生产 </text>

  <rect x="962" y="168" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="963" y="180" width="3.5" height="69" rx="1.75" fill="#28407A"/>
  <text x="980" y="200.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">宿主边界 </text>
  <text x="980" y="217.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">以 Spring Boot 宿主示例提供 REST / </text>
  <text x="980" y="233.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">SSE 接入范式 </text>

  <rect x="962" y="298.5" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="963" y="310.5" width="3.5" height="69" rx="1.75" fill="#28407A"/>
  <text x="980" y="339" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">多租户与安全 </text>
  <text x="980" y="356" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">租户隔离、凭据动态解析、审计日志 </text>

  <rect x="962" y="429" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="963" y="441" width="3.5" height="69" rx="1.75" fill="#28407A"/>
  <text x="980" y="469.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">可观测性 </text>
  <text x="980" y="486.5" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">traceId 贯穿 + 指标 / 日志 / 链路 </text>

  <rect x="962" y="559.5" width="381" height="93" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="963" y="571.5" width="3.5" height="69" rx="1.75" fill="#28407A"/>
  <text x="980" y="600" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">平台化 </text>
  <text x="980" y="617" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">技能与工作流市场、版本与灰度发布 </text>

