  <path d="M44,152 L44,118 Q44,108 54,108 L439,108 Q449,108 449,118 L449,152 Z" fill="#2F7D32"/>
  <text x="60" y="136" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">近期（1-2 周）· 打通真实链路 </text>

  <rect x="56" y="168" width="381" height="96" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="57" y="180" width="3.5" height="72" rx="1.75" fill="#2F7D32"/>
  <text x="74" y="194" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">供应商在线验证 </text>
  <text x="74" y="211" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">逐平台跑通同步 / 流式 / 工具调用 </text>
  <text x="74" y="227" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">当前部分账号存在余额与授权问题， </text>
  <text x="74" y="243" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">需先修复账号或换可用模型 </text>

  <rect x="56" y="300" width="381" height="96" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="57" y="312" width="3.5" height="72" rx="1.75" fill="#2F7D32"/>
  <text x="74" y="326" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">Milvus 语义记忆实测 </text>
  <text x="74" y="343" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">真实嵌入模型替换离线占位嵌入 </text>
  <text x="74" y="359" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">（HashingEmbeddingClient）， </text>
  <text x="74" y="375" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">维度与集合策略对齐 </text>

  <rect x="56" y="432" width="381" height="92" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="57" y="444" width="3.5" height="68" rx="1.75" fill="#2F7D32"/>
  <text x="74" y="472" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#243B53">视频生成端到端 </text>
  <text x="74" y="489" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#243B53">补齐异步任务 provider 适配与回调解析 </text>

  <rect x="56" y="560" width="381" height="92" rx="8" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="1"/>
  <rect x="57" y="572" width="3.5" height="68" rx="1.75" fill="#2F7D32"/>
