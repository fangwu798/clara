  <text x="72" y="768" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A2E2C">上线前须逐项确认 </text>

  <rect x="236" y="700" width="264" height="116" rx="8" fill="#FFFFFF" stroke="#E3B9B7" stroke-width="1"/>
