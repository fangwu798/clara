  <text x="534" y="769" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A2E2C">单机演示，生产需替换为共享实现 </text>

  <rect x="796" y="700" width="264" height="116" rx="8" fill="#FFFFFF" stroke="#E3B9B7" stroke-width="1"/>
  <rect x="797" y="712" width="3.5" height="92" rx="1.75" fill="#C0504D"/>
  <text x="814" y="752" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A2E2C">仓库尚未附带完整许可证与 </text>
  <text x="814" y="769" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A2E2C">第三方归属清单，商用分发前需补齐 </text>

  <rect x="1076" y="700" width="264" height="116" rx="8" fill="#FFFFFF" stroke="#E3B9B7" stroke-width="1"/>
  <rect x="1077" y="712" width="3.5" height="92" rx="1.75" fill="#C0504D"/>
