<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4C566A"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="860" fill="#FFFFFF"/>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#2E3440">Clara 分层与模块职责</text>
  <text x="40" y="56" font-size="10.5" fill="#6B7280">Java 8 AI 应用运行时库 · 1 个 BOM + 8 个代码模块 · 竖向箭头表示调用 / 装配方向</text>

  <text x="956" y="34" font-size="13" font-weight="700" fill="#C0504D">外部依赖（对外访问）</text>
  <text x="956" y="56" font-size="10.5" fill="#6B7280">仅由能力模块经 core 端口访问外部系统。</text>
  <text x="956" y="74" font-size="10.5" fill="#6B7280">未配置时按模块降级或跳过。</text>

  <rect x="40" y="72" width="880" height="120" rx="12" fill="#F3F8FD" stroke="#C6DDF2"/>
  <text x="56" y="96" font-size="13" font-weight="700" fill="#2B6CB0">① 宿主层 / 访问边界</text>

  <rect x="56" y="106" width="416" height="54" rx="8" fill="#FFFFFF" stroke="#9CC4E6"/>
  <text x="264" y="126" font-size="12" font-weight="700" fill="#24425E" text-anchor="middle">宿主 Java 应用：自建 REST / SSE / UI</text>
  <text x="264" y="146" font-size="10.5" fill="#5A6B7B" text-anchor="middle">本仓库不提供 Spring Boot 或 Web 容器</text>

  <rect x="488" y="106" width="416" height="54" rx="8" fill="#FFFFFF" stroke="#9CC4E6"/>
  <text x="696" y="126" font-size="12" font-weight="700" fill="#24425E" text-anchor="middle">交互式对话控制台（唯一运行模式）</text>
  <text x="696" y="146" font-size="10.5" fill="#5A6B7B" text-anchor="middle">入口 com.clara.ClaraApplication</text>

  <text x="56" y="180" font-size="10.5" fill="#6B7280">标注：REST / SSE / UI 由宿主自行搭建；Clara 以库形式运行在宿主 JVM 进程内。</text>

  <line x1="480" y1="194" x2="480" y2="214" stroke="#4C566A" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="492" y="209" font-size="10.5" fill="#4C566A">宿主调用 → 装配层</text>

  <rect x="40" y="216" width="880" height="158" rx="12" fill="#FFF8EE" stroke="#F0D2A8"/>
  <text x="56" y="240" font-size="13" font-weight="700" fill="#B26A00">② 装配层 · clara-application</text>

  <rect x="56" y="248" width="848" height="38" rx="8" fill="#FFFFFF" stroke="#E0A94C"/>
  <text x="480" y="272" font-size="12" font-weight="700" fill="#7A4A00" text-anchor="middle">ApplicationBootstrap —— 唯一装配点：把 core 契约绑定到各模块实现</text>

  <rect x="56" y="298" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E0A94C"/>
  <text x="156" y="318" font-size="12" font-weight="700" fill="#7A4A00" text-anchor="middle">ModelRegistry</text>
  <text x="156" y="338" font-size="10.5" fill="#6B7280" text-anchor="middle">模型选择 / 平台配置 / 可用性探测</text>

  <rect x="272" y="298" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E0A94C"/>
  <text x="372" y="318" font-size="12" font-weight="700" fill="#7A4A00" text-anchor="middle">WorkflowCatalog</text>
  <text x="372" y="338" font-size="10.5" fill="#6B7280" text-anchor="middle">工作流清单 / 自定义流程热加载</text>

  <rect x="488" y="298" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E0A94C"/>
  <text x="588" y="318" font-size="12" font-weight="700" fill="#7A4A00" text-anchor="middle">WorkflowRunner</text>
  <text x="588" y="338" font-size="10.5" fill="#6B7280" text-anchor="middle">工作流运行器 / 媒体资产运行时</text>

  <rect x="704" y="298" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E0A94C"/>
  <text x="804" y="318" font-size="12" font-weight="700" fill="#7A4A00" text-anchor="middle">CompositeToolInvoker</text>
  <text x="804" y="338" font-size="10.5" fill="#6B7280" text-anchor="middle">本地技能优先 / MCP 兜底</text>

  <line x1="480" y1="376" x2="480" y2="396" stroke="#4C566A" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="492" y="391" font-size="10.5" fill="#4C566A">装配 / 注入实现</text>

  <rect x="40" y="398" width="880" height="274" rx="12" fill="#F4FBF4" stroke="#CFE6CF"/>
  <text x="56" y="422" font-size="13" font-weight="700" fill="#2F7D32">③ 能力模块层（6 个，仅通过 core 契约交互）</text>

  <rect x="56" y="432" width="272" height="106" rx="8" fill="#F4FBF4" stroke="#CFE6CF"/>
  <text x="70" y="456" font-size="12.5" font-weight="700" fill="#2F7D32">clara-orchestration</text>
  <text x="70" y="476" font-size="10.5" fill="#6B7280">对话编排 · Agent Loop</text>
  <text x="70" y="493" font-size="10.5" fill="#6B7280">ContextAssembler 上下文装配</text>
  <text x="70" y="510" font-size="10.5" fill="#6B7280">ToolRoundTripCoordinator 工具回环</text>
  <text x="70" y="527" font-size="10.5" fill="#6B7280">依赖 core</text>

  <rect x="344" y="432" width="272" height="106" rx="8" fill="#EAF0FB" stroke="#5B7FCB"/>
  <text x="358" y="456" font-size="12.5" font-weight="700" fill="#28407A">clara-model</text>
  <text x="358" y="476" font-size="10.5" fill="#6B7280">统一模型调用 · 协议编解码</text>
  <text x="358" y="493" font-size="10.5" fill="#6B7280">HTTP + SSE 传输 · Token 估算</text>
  <text x="358" y="510" font-size="10.5" fill="#6B7280">媒体生成：图像 / 语音 / 视频</text>
  <text x="358" y="527" font-size="10.5" fill="#6B7280">依赖 core</text>

  <rect x="632" y="432" width="272" height="106" rx="8" fill="#F4FBF4" stroke="#CFE6CF"/>
  <text x="646" y="456" font-size="12.5" font-weight="700" fill="#2F7D32">clara-memory</text>
  <text x="646" y="476" font-size="10.5" fill="#6B7280">窗口记忆 · 会话持久化</text>
  <text x="646" y="493" font-size="10.5" fill="#6B7280">Milvus 语义记忆（可选）</text>
  <text x="646" y="510" font-size="10.5" fill="#6B7280">对话记录入库与召回</text>
  <text x="646" y="527" font-size="10.5" fill="#6B7280">依赖 core</text>

  <rect x="56" y="552" width="272" height="106" rx="8" fill="#EAF0FB" stroke="#5B7FCB"/>
  <text x="70" y="576" font-size="12.5" font-weight="700" fill="#28407A">clara-mcp</text>
  <text x="70" y="596" font-size="10.5" fill="#6B7280">MCP 客户端 · 注册发现</text>
  <text x="70" y="613" font-size="10.5" fill="#6B7280">stdio + Streamable HTTP</text>
  <text x="70" y="630" font-size="10.5" fill="#6B7280">工具与资源统一调用门面</text>
  <text x="70" y="647" font-size="10.5" fill="#6B7280">依赖 core</text>

  <rect x="344" y="552" width="272" height="106" rx="8" fill="#F4FBF4" stroke="#CFE6CF"/>
  <text x="358" y="576" font-size="12.5" font-weight="700" fill="#2F7D32">clara-workflow</text>
  <text x="358" y="596" font-size="10.5" fill="#6B7280">DAG 执行 / 任务规划</text>
  <text x="358" y="613" font-size="10.5" fill="#6B7280">预算台账 / 人工交互与检查点</text>
  <text x="358" y="630" font-size="10.5" fill="#6B7280">流程定义热加载 · 状态持久化</text>
  <text x="358" y="647" font-size="10.5" fill="#6B7280">依赖 core</text>

  <rect x="632" y="552" width="272" height="106" rx="8" fill="#EAF0FB" stroke="#5B7FCB"/>
  <text x="646" y="576" font-size="12.5" font-weight="700" fill="#28407A">clara-skill</text>
  <text x="646" y="596" font-size="10.5" fill="#6B7280">技能注册 · Schema 校验</text>
  <text x="646" y="613" font-size="10.5" fill="#6B7280">工具执行 / 结果封装</text>
  <text x="646" y="630" font-size="10.5" fill="#6B7280">技能发现与调用入口</text>
  <text x="646" y="647" font-size="10.5" fill="#6B7280">依赖 core</text>

  <line x1="480" y1="674" x2="480" y2="698" stroke="#4C566A" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="492" y="691" font-size="10.5" fill="#4C566A">能力模块编译期依赖 core</text>

  <rect x="40" y="702" width="880" height="118" rx="12" fill="#F2F5F9" stroke="#5C7A99"/>
  <text x="56" y="726" font-size="13" font-weight="700" fill="#243B53">④ 基础层</text>

  <rect x="56" y="736" width="416" height="72" rx="8" fill="#FFFFFF" stroke="#9FB3C8"/>
  <text x="264" y="758" font-size="12.5" font-weight="700" fill="#243B53" text-anchor="middle">clara-core</text>
  <text x="264" y="778" font-size="10.5" fill="#6B7280" text-anchor="middle">能力 / 角色 / 协议枚举 · 结构化错误模型</text>
  <text x="264" y="794" font-size="10.5" fill="#6B7280" text-anchor="middle">跨模块契约层，不依赖任何业务模块</text>

  <rect x="488" y="736" width="416" height="72" rx="8" fill="#FFFFFF" stroke="#9FB3C8"/>
  <text x="696" y="758" font-size="12.5" font-weight="700" fill="#243B53" text-anchor="middle">clara-bom</text>
  <text x="696" y="778" font-size="10.5" fill="#6B7280" text-anchor="middle">对外发布的版本清单（dependencyManagement）</text>
  <text x="696" y="794" font-size="10.5" fill="#6B7280" text-anchor="middle">统一 9 个模块版本，供宿主直接引入</text>

  <rect x="956" y="104" width="284" height="74" rx="8" fill="#FBEAEA" stroke="#C0504D" stroke-dasharray="5 4"/>
  <text x="970" y="124" font-size="12" font-weight="700" fill="#7A2E2C">模型 Provider</text>
  <text x="970" y="142" font-size="10.5" fill="#6B7280">OpenAI / DeepSeek / 火山方舟</text>
  <text x="970" y="158" font-size="10.5" fill="#6B7280">阿里云 / Kimi / Anthropic</text>

  <rect x="956" y="196" width="284" height="74" rx="8" fill="#FBEAEA" stroke="#C0504D" stroke-dasharray="5 4"/>
  <text x="970" y="216" font-size="12" font-weight="700" fill="#7A2E2C">外部 MCP 服务</text>
  <text x="970" y="234" font-size="10.5" fill="#6B7280">codebase-memory-mcp（代码知识图谱）</text>
  <text x="970" y="250" font-size="10.5" fill="#6B7280">ProcessOn（在线绘图 / 图文档）</text>

  <rect x="956" y="288" width="284" height="74" rx="8" fill="#FBEAEA" stroke="#C0504D" stroke-dasharray="5 4"/>
  <text x="970" y="308" font-size="12" font-weight="700" fill="#7A2E2C">Milvus 向量库</text>
  <text x="970" y="326" font-size="10.5" fill="#6B7280">etcd + MinIO + standalone</text>
  <text x="970" y="342" font-size="10.5" fill="#6B7280">可选 · 未配置时降级为进程内实现</text>

  <line x1="944" y1="141" x2="944" y2="520" stroke="#C0504D" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="954" y1="141" x2="944" y2="141" stroke="#C0504D" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="954" y1="233" x2="944" y2="233" stroke="#C0504D" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="954" y1="325" x2="944" y2="325" stroke="#C0504D" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="944" y1="520" x2="924" y2="520" stroke="#C0504D" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arD)"/>
  <text x="928" y="546" font-size="10.5" fill="#C0504D">对外访问</text>

  <text x="956" y="680" font-size="12" font-weight="700" fill="#6B7280">图例</text>
  <rect x="956" y="690" width="16" height="12" rx="3" fill="#F4FBF4" stroke="#CFE6CF"/>
  <text x="980" y="700" font-size="10.5" fill="#6B7280">对话与执行主线：编排 / 记忆 / 技能</text>
  <rect x="956" y="712" width="16" height="12" rx="3" fill="#EAF0FB" stroke="#5B7FCB"/>
  <text x="980" y="722" font-size="10.5" fill="#6B7280">模型与集成能力：模型 / MCP / 工作流</text>
  <rect x="956" y="734" width="16" height="12" rx="3" fill="#FBEAEA" stroke="#C0504D"/>
  <text x="980" y="744" font-size="10.5" fill="#6B7280">外部依赖：对外访问边界</text>
  <rect x="956" y="756" width="16" height="12" rx="3" fill="#F2F5F9" stroke="#5C7A99"/>
  <text x="980" y="766" font-size="10.5" fill="#6B7280">基础层：clara-core 与 clara-bom</text>

  <text x="40" y="840" font-size="10.5" fill="#6B7280">说明：六个能力模块之间不直接依赖，全部通过 clara-core 契约通信；外部依赖仅由能力模块经 core 端口访问。</text>
</svg>