  <line x1="92" y1="465" x2="97" y2="465" stroke="#3B82C4" stroke-width="1.2"/>
  <text x="110" y="462" font-size="12.5" font-weight="700" fill="#2B6CB0">模型调用</text>
  <text x="110" y="478" font-size="10.5" fill="#6B7280">6 大平台协议适配</text>
  <text x="62" y="506" font-size="10.5" fill="#5A6B7B">OpenAI · DeepSeek · 火山方舟</text>
  <text x="62" y="522" font-size="10.5" fill="#5A6B7B">阿里云 · Kimi · Anthropic</text>

  <rect x="448" y="432" width="384" height="120" rx="8" fill="#FFFFFF" stroke="#5AA45D" stroke-width="1.2"/>
  <rect x="462" y="446" width="38" height="38" rx="8" fill="#EAF6EA" stroke="#5AA45D" stroke-width="0.9"/>
  <line x1="470" y1="455" x2="490" y2="455" stroke="#5AA45D" stroke-width="1.2"/>
  <line x1="469" y1="457" x2="477" y2="474" stroke="#5AA45D" stroke-width="1.2"/>
  <line x1="491" y1="457" x2="483" y2="474" stroke="#5AA45D" stroke-width="1.2"/>
  <circle cx="466" cy="455" r="3.5" fill="#5AA45D"/>
  <circle cx="494" cy="455" r="3.5" fill="#5AA45D"/>
  <circle cx="480" cy="478" r="4.5" fill="#5AA45D"/>
  <text x="510" y="462" font-size="12.5" font-weight="700" fill="#3F7A42">会话记忆</text>
  <text x="510" y="478" font-size="10.5" fill="#6B7280">窗口 + 持久化 + 语义召回</text>
  <text x="462" y="506" font-size="10.5" fill="#5A6B7B">窗口记忆 + 本地持久化</text>
  <text x="462" y="522" font-size="10.5" fill="#5A6B7B">Milvus 语义召回</text>

  <rect x="848" y="432" width="384" height="120" rx="8" fill="#FFFFFF" stroke="#E0A94C" stroke-width="1.2"/>
  <rect x="862" y="446" width="38" height="38" rx="8" fill="#FDF3E3" stroke="#E0A94C" stroke-width="0.9"/>
  <line x1="872" y1="465" x2="874" y2="465" stroke="#E0A94C" stroke-width="1.4"/>
  <line x1="888" y1="465" x2="890" y2="465" stroke="#E0A94C" stroke-width="1.4"/>
  <rect x="864" y="460" width="8" height="10" rx="2" fill="#E0A94C"/>
  <rect x="890" y="460" width="8" height="10" rx="2" fill="#E0A94C"/>
  <circle cx="881" cy="465" r="7" fill="none" stroke="#E0A94C" stroke-width="1.4"/>
  <text x="910" y="462" font-size="12.5" font-weight="700" fill="#B26A00">MCP 客户端</text>
  <text x="910" y="478" font-size="10.5" fill="#6B7280">MCP 工具接入标准</text>
  <text x="862" y="506" font-size="10.5" fill="#5A6B7B">stdio / Streamable HTTP</text>
  <text x="862" y="522" font-size="10.5" fill="#5A6B7B">本地技能优先，外部工具兜底</text>
  <rect x="48" y="568" width="384" height="120" rx="8" fill="#FFFFFF" stroke="#3B82C4" stroke-width="1.2"/>
  <rect x="62" y="582" width="38" height="38" rx="8" fill="#EAF3FC" stroke="#3B82C4" stroke-width="0.9"/>
  <line x1="79" y1="596" x2="72" y2="605" stroke="#3B82C4" stroke-width="1.3" marker-end="url(#arw)"/>
  <line x1="83" y1="596" x2="90" y2="605" stroke="#3B82C4" stroke-width="1.3" marker-end="url(#arw)"/>
  <circle cx="81" cy="592" r="5" fill="#3B82C4"/>
  <circle cx="70" cy="610" r="5" fill="none" stroke="#3B82C4" stroke-width="1.3"/>
  <circle cx="92" cy="610" r="5" fill="none" stroke="#3B82C4" stroke-width="1.3"/>
  <text x="110" y="598" font-size="12.5" font-weight="700" fill="#2B6CB0">工作流编排</text>
  <text x="110" y="614" font-size="10.5" fill="#6B7280">DAG · 多角色 · 可恢复</text>
  <text x="62" y="642" font-size="10.5" fill="#5A6B7B">人工确认 + 检查点恢复</text>
  <text x="62" y="658" font-size="10.5" fill="#5A6B7B">多角色分阶段协作</text>

  <rect x="448" y="568" width="384" height="120" rx="8" fill="#FFFFFF" stroke="#5AA45D" stroke-width="1.2"/>
  <rect x="462" y="582" width="38" height="38" rx="8" fill="#EAF6EA" stroke="#5AA45D" stroke-width="0.9"/>
  <rect x="466" y="586" width="14" height="14" rx="3" fill="#5AA45D"/>
