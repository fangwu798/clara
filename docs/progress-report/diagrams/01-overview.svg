  <rect x="466" y="604" width="14" height="14" rx="3" fill="none" stroke="#5AA45D" stroke-width="1.3"/>
  <rect x="484" y="604" width="14" height="14" rx="3" fill="#8CC48E"/>
  <text x="510" y="598" font-size="12.5" font-weight="700" fill="#3F7A42">技能体系</text>
  <text x="510" y="614" font-size="10.5" fill="#6B7280">16 个技能提示词 · 15 个脚本工具</text>
  <text x="462" y="642" font-size="10.5" fill="#5A6B7B">文档解析 · 文件操作 · 代码图谱</text>
  <text x="462" y="658" font-size="10.5" fill="#5A6B7B">图像 / 视频生成 · 可注册扩展</text>

  <rect x="848" y="568" width="384" height="120" rx="8" fill="#FFFFFF" stroke="#E0A94C" stroke-width="1.2"/>
  <rect x="862" y="582" width="38" height="38" rx="8" fill="#FDF3E3" stroke="#E0A94C" stroke-width="0.9"/>
  <rect x="866" y="588" width="28" height="24" rx="4" fill="none" stroke="#E0A94C" stroke-width="1.4"/>
  <line x1="866" y1="596" x2="894" y2="596" stroke="#E0A94C" stroke-width="1"/>
  <polyline points="872,602 878,606 872,610" fill="none" stroke="#E0A94C" stroke-width="1.3"/>
  <line x1="882" y1="610" x2="890" y2="610" stroke="#E0A94C" stroke-width="1.3"/>
  <text x="910" y="598" font-size="12.5" font-weight="700" fill="#B26A00">应用装配</text>
  <text x="910" y="614" font-size="10.5" fill="#6B7280">交互式控制台 clara.jar</text>
  <text x="862" y="642" font-size="10.5" fill="#5A6B7B">一个入口跑通全链路</text>
  <text x="862" y="658" font-size="10.5" fill="#5A6B7B">库形态可嵌入宿主系统</text>

  <!-- 5. 交付形态 -->
  <rect x="32" y="716" width="1216" height="60" rx="12" fill="#F3F8FD" stroke="#C6DDF2"/>
  <rect x="48" y="737" width="18" height="18" rx="5" fill="#3B82C4"/>
  <path d="M52,746 l4,-4 4,4 4,-7" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="751" font-size="13" font-weight="700" fill="#2B6CB0">交付形态</text>
  <text x="146" y="751" font-size="11.5" fill="#2E3440">交付物 = 9 个 Maven 模块 + 可执行 clara.jar + 配置化能力（模型 / 工作流 / 技能 / 提示词）+ 部署脚本</text>
</svg>
