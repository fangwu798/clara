<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5AA45D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#FFFFFF"/>

  <!-- 1. 定位条：Clara 是什么 -->
  <rect x="32" y="20" width="1216" height="96" rx="12" fill="#F3F8FD" stroke="#C6DDF2"/>
  <line x1="38" y1="38" x2="38" y2="98" stroke="#3B82C4" stroke-width="4" stroke-linecap="round"/>
  <text x="58" y="60" font-size="20" font-weight="700" fill="#2E3440">Clara · Java 8 AI 应用运行时库</text>
  <text x="58" y="88" font-size="11.5" fill="#6B7280">把大模型能力、MCP 工具与多步工作流沉淀为可嵌入 Java 系统的稳定运行时。</text>

  <!-- 2. 谁在用 -->
  <rect x="32" y="128" width="1216" height="104" rx="12" fill="#F4FBF4" stroke="#CFE6CF"/>
  <text x="48" y="151" font-size="13.5" font-weight="700" fill="#3F7A42">谁在用</text>

  <rect x="48" y="162" width="384" height="56" rx="8" fill="#FFFFFF" stroke="#5AA45D" stroke-width="1.2"/>
  <rect x="62" y="174" width="32" height="32" rx="6" fill="#EAF6EA" stroke="#5AA45D" stroke-width="1"/>
  <line x1="62" y1="184" x2="94" y2="184" stroke="#5AA45D" stroke-width="1"/>
  <rect x="68" y="189" width="7" height="11" fill="#8CC48E"/>
  <rect x="79" y="194" width="7" height="6" fill="#5AA45D"/>
  <circle cx="88" cy="191" r="3" fill="#5AA45D"/>
  <text x="104" y="185" font-size="12.5" font-weight="700" fill="#2F6B33">宿主 Java 应用</text>
  <text x="104" y="203" font-size="10.5" fill="#6B7280">Spring Boot 工程、批处理服务、内部平台</text>

  <rect x="448" y="162" width="384" height="56" rx="8" fill="#FFFFFF" stroke="#5AA45D" stroke-width="1.2"/>
  <circle cx="478" cy="181" r="7" fill="none" stroke="#5AA45D" stroke-width="1.4"/>
  <path d="M466,200 a12,11 0 0 1 24,0" fill="none" stroke="#5AA45D" stroke-width="1.4"/>
  <text x="504" y="185" font-size="12.5" font-weight="700" fill="#2F6B33">业务研发团队</text>
  <text x="504" y="203" font-size="10.5" fill="#6B7280">无需自建模型网关与工具链路</text>

  <rect x="848" y="162" width="384" height="56" rx="8" fill="#FFFFFF" stroke="#5AA45D" stroke-width="1.2"/>
  <circle cx="878" cy="190" r="8" fill="none" stroke="#5AA45D" stroke-width="1.4"/>
  <line x1="878" y1="180" x2="878" y2="176" stroke="#5AA45D" stroke-width="1.4"/>
  <line x1="878" y1="200" x2="878" y2="204" stroke="#5AA45D" stroke-width="1.4"/>
  <line x1="870" y1="190" x2="866" y2="190" stroke="#5AA45D" stroke-width="1.4"/>
  <line x1="886" y1="190" x2="890" y2="190" stroke="#5AA45D" stroke-width="1.4"/>
  <text x="904" y="185" font-size="12.5" font-weight="700" fill="#2F6B33">智能化改造项目</text>
  <text x="904" y="203" font-size="10.5" fill="#6B7280">存量系统快速接入大模型能力</text>
  <!-- 3. 解决什么问题 -->
  <rect x="32" y="244" width="1216" height="140" rx="12" fill="#FFF8EE" stroke="#F0D2A8"/>
  <text x="48" y="266" font-size="13.5" font-weight="700" fill="#B26A00">解决什么问题</text>

  <circle cx="60" cy="288" r="9.5" fill="#C0504D"/>
  <text x="60" y="292" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="80" y="292" font-size="11" fill="#2E3440">供应商协议与 SDK 差异被隔离，业务代码不感知平台</text>

  <circle cx="60" cy="314" r="9.5" fill="#C0504D"/>
  <text x="60" y="318" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="80" y="318" font-size="11" fill="#2E3440">一次调用 = 模型 + 工具 + 工作流 + 记忆的统一编排</text>

  <circle cx="60" cy="340" r="9.5" fill="#C0504D"/>
  <text x="60" y="344" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="80" y="344" font-size="11" fill="#2E3440">超时 / 取消 / 错误码 / traceId 贯穿每次外部调用</text>

  <circle cx="60" cy="366" r="9.5" fill="#C0504D"/>
  <text x="60" y="370" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="80" y="370" font-size="11" fill="#2E3440">网络、凭据、文件与工具访问有明确安全边界</text>

  <!-- 4. 六大能力 -->
  <rect x="32" y="396" width="1216" height="308" rx="12" fill="#F3F8FD" stroke="#C6DDF2"/>
  <text x="48" y="420" font-size="13.5" font-weight="700" fill="#2B6CB0">六大能力</text>
  <text x="1232" y="420" font-size="11" fill="#6B7280" text-anchor="end">每个模块可单独引入，也可组合装配</text>

  <rect x="48" y="432" width="384" height="120" rx="8" fill="#FFFFFF" stroke="#3B82C4" stroke-width="1.2"/>
  <rect x="62" y="446" width="38" height="38" rx="8" fill="#EAF3FC" stroke="#3B82C4" stroke-width="0.9"/>
