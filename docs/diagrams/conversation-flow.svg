<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" width="1240" height="1060" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1060" fill="#FFFFFF"/>

  <text x="40" y="32" font-size="20" font-weight="700" fill="#2E3440">核心业务流程图 · 对话编排（Agent Loop）</text>
  <text x="40" y="52" font-size="12" fill="#6B7280">一次 converse() 请求的完整链路：装配上下文 → 调用模型 →（含工具调用则执行并回填）→ 循环直至产出最终答复。</text>

  <!-- 开始 -->
  <rect x="330" y="64" width="260" height="46" rx="23" fill="#E3F0FB" stroke="#3B82C4" stroke-width="1.6"/>
  <text x="460" y="92" font-size="13.5" font-weight="700" fill="#1E4E77" text-anchor="middle">宿主提交用户输入</text>
  <line x1="460" y1="110" x2="460" y2="134" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 绑定上下文 -->
  <rect x="180" y="136" width="560" height="56" rx="8" fill="#F2F5F9" stroke="#5C7A99" stroke-width="1.5"/>
  <text x="460" y="169" font-size="12.5" fill="#243B53" text-anchor="middle">绑定会话上下文 ConvContext（请求携带取消令牌时复用，否则新建）</text>
  <line x1="460" y1="192" x2="460" y2="216" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 追加用户消息 -->
  <rect x="180" y="218" width="560" height="56" rx="8" fill="#F2F5F9" stroke="#5C7A99" stroke-width="1.5"/>
  <text x="460" y="251" font-size="12.5" fill="#243B53" text-anchor="middle">追加本轮用户消息到窗口记忆（对话能力带图时为多模态消息）</text>
  <line x1="460" y1="274" x2="460" y2="298" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 装配上下文（循环入口） -->
  <rect x="180" y="300" width="560" height="64" rx="8" fill="#E8F5E9" stroke="#5AA45D" stroke-width="1.6"/>
  <text x="460" y="326" font-size="12.5" font-weight="700" fill="#1F4D23" text-anchor="middle">装配上下文（ContextAssembler）</text>
  <text x="460" y="346" font-size="11" fill="#3C5A42" text-anchor="middle">窗口裁剪 · 超限压缩摘要 · 技能匹配 · 语义检索注入</text>
  <line x1="460" y1="364" x2="460" y2="388" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 调用模型 -->
  <rect x="180" y="390" width="560" height="72" rx="8" fill="#EAF0FB" stroke="#5B7FCB" stroke-width="1.6"/>
  <text x="460" y="415" font-size="12.5" font-weight="700" fill="#28407A" text-anchor="middle">能力分派调用模型（CapabilityDispatcher → IStreamModel）</text>
  <text x="460" y="435" font-size="11" fill="#3B4E70" text-anchor="middle">CHAT 下发 messages + tools；IMAGE / VIDEO 走生成提示词</text>
  <text x="460" y="452" font-size="11" fill="#3B4E70" text-anchor="middle">流式（宿主给出观察者）或非流式</text>
  <line x1="460" y1="462" x2="460" y2="486" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 记录调用 -->
  <rect x="180" y="488" width="560" height="52" rx="8" fill="#F2F5F9" stroke="#5C7A99" stroke-width="1.5"/>
  <text x="460" y="519" font-size="12.5" fill="#243B53" text-anchor="middle">发布调用记录（CallRecordPublisher → ICallRecordSink）</text>
  <line x1="460" y1="540" x2="460" y2="562" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 判断 -->
  <path d="M460,564 L630,622 L460,680 L290,622 Z" fill="#FFF6E0" stroke="#D99A2B" stroke-width="1.6"/>
  <text x="460" y="618" font-size="12.5" font-weight="700" fill="#7A5410" text-anchor="middle">响应是否含</text>
  <text x="460" y="634" font-size="12.5" font-weight="700" fill="#7A5410" text-anchor="middle">工具调用？</text>

  <!-- 是：执行工具 -->
  <line x1="630" y1="622" x2="790" y2="622" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="700" y="612" font-size="12" font-weight="700" fill="#2F7D32" text-anchor="middle">是</text>

  <rect x="794" y="560" width="392" height="124" rx="8" fill="#FDF1E6" stroke="#D98A2B" stroke-width="1.6"/>
  <text x="810" y="582" font-size="12.5" font-weight="700" fill="#8A5410">执行工具调用（ToolRoundTripCoordinator）</text>
  <text x="810" y="604" font-size="11" fill="#6B4A22">· 本地技能优先，外部 MCP 工具兜底</text>
  <text x="810" y="622" font-size="11" fill="#6B4A22">· 单次工具失败 → 以错误文本回填，不中断整轮</text>
  <text x="810" y="640" font-size="11" fill="#6B4A22">· 追加「助手工具调用消息 + 工具结果消息」到历史</text>
  <text x="810" y="662" font-size="11" fill="#6B4A22">· 回填后回到「装配上下文」再次请求模型</text>

  <!-- 回边 -->
  <path d="M1186,622 L1214,622 L1214,332 L742,332" fill="none" stroke="#2F7D32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text transform="translate(1206,486) rotate(-90)" font-size="11" fill="#2F7D32" text-anchor="middle">回填后重新装配（循环）</text>

  <!-- 否：结束 -->
  <line x1="460" y1="680" x2="460" y2="706" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="474" y="698" font-size="12" font-weight="700" fill="#B23A3A">否</text>

  <rect x="180" y="708" width="560" height="56" rx="8" fill="#F2F5F9" stroke="#5C7A99" stroke-width="1.5"/>
  <text x="460" y="741" font-size="12.5" fill="#243B53" text-anchor="middle">提取结果正文，追加助手回复到历史（正文为空则不写入）</text>
  <line x1="460" y1="764" x2="460" y2="788" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="180" y="790" width="560" height="56" rx="8" fill="#F2F5F9" stroke="#5C7A99" stroke-width="1.5"/>
  <text x="460" y="823" font-size="12.5" fill="#243B53" text-anchor="middle">构建 ConversationResult（COMPLETED，含 token 用量与工具往返次数）</text>
  <line x1="460" y1="846" x2="460" y2="870" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="330" y="872" width="260" height="46" rx="23" fill="#E3F0FB" stroke="#3B82C4" stroke-width="1.6"/>
  <text x="460" y="900" font-size="13.5" font-weight="700" fill="#1E4E77" text-anchor="middle">返回结果</text>

  <!-- 旁路说明 -->
  <rect x="180" y="948" width="880" height="92" rx="8" fill="#FBEAEA" stroke="#C0504D" stroke-dasharray="5 4"/>
  <text x="196" y="972" font-size="12.5" font-weight="700" fill="#7A2E2C">旁路分支（不影响主流程）</text>
  <text x="196" y="994" font-size="11" fill="#6B3A38">· 取消：每轮循环开始调用 throwIfCancelled()，令牌置位即中断，以 CANCELLED 收尾（可中断模型读取与脚本工具）。</text>
  <text x="196" y="1012" font-size="11" fill="#6B3A38">· 失败：模型调用或工具执行抛异常时被捕获，以 FAILED 收尾并携带结构化错误码 / traceId。</text>
  <text x="196" y="1030" font-size="11" fill="#6B3A38">· 上限：请求显式给出正的 maxToolRoundTrips 时，超出即抛工具往返上限错误。</text>
</svg>
