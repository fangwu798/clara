<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 952" width="1440" height="952" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="952" fill="#FFFFFF"/>

  <text x="40" y="32" font-size="20" font-weight="700" fill="#2E3440">核心业务时序图 · 一次对话请求（含工具往返）</text>
  <text x="40" y="52" font-size="12" fill="#6B7280">参与者自上而下为一次 converse() 请求经过的关键组件；实线为调用，虚线为返回。</text>

  <!-- 参与者 -->
  <g>
    <rect x="25" y="60" width="150" height="48" rx="8" fill="#E3F0FB" stroke="#3B82C4"/>
    <text x="100" y="80" font-size="12.5" font-weight="700" fill="#1E4E77" text-anchor="middle">宿主</text>
    <text x="100" y="97" font-size="9.5" fill="#3B6E96" text-anchor="middle">Console / CLI / REST-SSE</text>

    <rect x="200" y="60" width="150" height="48" rx="8" fill="#E8F5E9" stroke="#5AA45D"/>
    <text x="275" y="80" font-size="12.5" font-weight="700" fill="#1F4D23" text-anchor="middle">编排器</text>
    <text x="275" y="97" font-size="9.5" fill="#3C5A42" text-anchor="middle">ConversationOrchestrator</text>

    <rect x="375" y="60" width="150" height="48" rx="8" fill="#F4EAF9" stroke="#8E5BB5"/>
    <text x="450" y="80" font-size="12.5" font-weight="700" fill="#5A2E77" text-anchor="middle">窗口记忆</text>
    <text x="450" y="97" font-size="9.5" fill="#5E4670" text-anchor="middle">IWindowMemory</text>

    <rect x="550" y="60" width="150" height="48" rx="8" fill="#E8F5E9" stroke="#5AA45D"/>
    <text x="625" y="80" font-size="12.5" font-weight="700" fill="#1F4D23" text-anchor="middle">上下文装配器</text>
    <text x="625" y="97" font-size="9.5" fill="#3C5A42" text-anchor="middle">ContextAssembler</text>

    <rect x="725" y="60" width="150" height="48" rx="8" fill="#EAF0FB" stroke="#5B7FCB"/>
    <text x="800" y="80" font-size="12.5" font-weight="700" fill="#28407A" text-anchor="middle">能力分派</text>
    <text x="800" y="97" font-size="9.5" fill="#3B4E70" text-anchor="middle">CapabilityDispatcher</text>

    <rect x="900" y="60" width="150" height="48" rx="8" fill="#FAFAFA" stroke="#9AA0A6" stroke-dasharray="4 3"/>
    <text x="975" y="80" font-size="12.5" font-weight="700" fill="#3A4250" text-anchor="middle">模型平台</text>
    <text x="975" y="97" font-size="9.5" fill="#6B7280" text-anchor="middle">Provider（HTTP / SSE）</text>

    <rect x="1075" y="60" width="150" height="48" rx="8" fill="#FDF1E6" stroke="#D98A2B"/>
    <text x="1150" y="80" font-size="12.5" font-weight="700" fill="#8A5410" text-anchor="middle">工具往返</text>
    <text x="1150" y="97" font-size="9.5" fill="#6B4A22" text-anchor="middle">ToolRoundTripCoordinator</text>

    <rect x="1250" y="60" width="150" height="48" rx="8" fill="#E6F6F4" stroke="#2E9E96"/>
    <text x="1325" y="80" font-size="12.5" font-weight="700" fill="#1B5F5A" text-anchor="middle">工具调用</text>
    <text x="1325" y="97" font-size="9.5" fill="#2F5855" text-anchor="middle">技能 / MCP 工具</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="100" y1="108" x2="100" y2="900"/>
    <line x1="275" y1="108" x2="275" y2="900"/>
    <line x1="450" y1="108" x2="450" y2="900"/>
    <line x1="625" y1="108" x2="625" y2="900"/>
    <line x1="800" y1="108" x2="800" y2="900"/>
    <line x1="975" y1="108" x2="975" y2="900"/>
    <line x1="1150" y1="108" x2="1150" y2="900"/>
    <line x1="1325" y1="108" x2="1325" y2="900"/>
  </g>

  <!-- m1 m2 -->
  <line x1="100" y1="160" x2="273" y2="160" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="131" y="141" width="112" height="15" fill="#FFFFFF"/>
  <text x="187" y="152" font-size="11" fill="#37474F" text-anchor="middle">converse(request)</text>

  <line x1="275" y1="196" x2="448" y2="196" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="301" y="177" width="122" height="15" fill="#FFFFFF"/>
  <text x="362" y="188" font-size="11" fill="#37474F" text-anchor="middle">append(userContent)</text>

  <!-- loop frame -->
  <rect x="50" y="232" width="1360" height="516" fill="none" stroke="#90A4AE" stroke-width="1.4"/>
  <rect x="50" y="232" width="196" height="22" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/>
  <text x="60" y="248" font-size="11.5" font-weight="700" fill="#37474F">loop 直到本轮响应不含工具调用</text>

  <line x1="275" y1="280" x2="623" y2="280" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="283" y="261" width="212" height="15" fill="#FFFFFF"/>
  <text x="449" y="272" font-size="11" fill="#37474F" text-anchor="middle">assemble(memory, control, estimator)</text>

  <line x1="625" y1="312" x2="452" y2="312" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="459" y="293" width="158" height="15" fill="#FFFFFF"/>
  <text x="538" y="304" font-size="11" fill="#37474F" text-anchor="middle">window(policy, estimator)</text>

  <line x1="450" y1="344" x2="623" y2="344" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="504" y="325" width="63" height="15" fill="#FFFFFF"/>
  <text x="536" y="336" font-size="11" fill="#6B7280" text-anchor="middle">窗口内历史</text>

  <line x1="625" y1="376" x2="277" y2="376" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="493" y="357" width="104" height="15" fill="#FFFFFF"/>
  <text x="545" y="368" font-size="11" fill="#6B7280" text-anchor="middle">messages + tools</text>

  <line x1="275" y1="424" x2="798" y2="424" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="442" y="405" width="188" height="15" fill="#FFFFFF"/>
  <text x="536" y="416" font-size="11" fill="#37474F" text-anchor="middle">invoke(httpRequest, observer)</text>

  <line x1="800" y1="456" x2="973" y2="456" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="852" y="437" width="68" height="15" fill="#FFFFFF"/>
  <text x="886" y="448" font-size="11" fill="#37474F" text-anchor="middle">HTTP / SSE</text>

  <line x1="975" y1="488" x2="802" y2="488" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="819" y="469" width="138" height="15" fill="#FFFFFF"/>
  <text x="888" y="480" font-size="11" fill="#6B7280" text-anchor="middle">内容 / 工具调用 / 用量</text>

  <line x1="800" y1="520" x2="277" y2="520" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="498" y="501" width="80" height="15" fill="#FFFFFF"/>
  <text x="538" y="512" font-size="11" fill="#6B7280" text-anchor="middle">HttpResponse</text>

  <!-- alt frame -->
  <rect x="60" y="556" width="1340" height="184" fill="none" stroke="#C0803A" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="60" y="556" width="200" height="22" fill="#FDF1E6" stroke="#C0803A" stroke-width="1.2"/>
  <text x="70" y="572" font-size="11.5" font-weight="700" fill="#8A5410">alt 响应含工具调用</text>

  <line x1="275" y1="590" x2="1148" y2="590" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="656" y="571" width="110" height="15" fill="#FFFFFF"/>
  <text x="711" y="582" font-size="11" fill="#37474F" text-anchor="middle">perform(response)</text>

  <line x1="1150" y1="622" x2="1323" y2="622" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="1199" y="603" width="74" height="15" fill="#FFFFFF"/>
  <text x="1236" y="614" font-size="11" fill="#37474F" text-anchor="middle">invoke(call)</text>

  <line x1="1325" y1="654" x2="1152" y2="654" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="1204" y="635" width="68" height="15" fill="#FFFFFF"/>
  <text x="1238" y="646" font-size="11" fill="#6B7280" text-anchor="middle">ToolResult</text>

  <line x1="1150" y1="686" x2="277" y2="686" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="634" y="667" width="158" height="15" fill="#FFFFFF"/>
  <text x="713" y="678" font-size="11" fill="#6B7280" text-anchor="middle">工具调用消息 + 工具结果消息</text>

  <line x1="275" y1="718" x2="448" y2="718" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="298" y="699" width="128" height="15" fill="#FFFFFF"/>
  <text x="362" y="710" font-size="11" fill="#37474F" text-anchor="middle">append(toolMessages)</text>

  <!-- 收尾 -->
  <line x1="275" y1="800" x2="448" y2="800" stroke="#37474F" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="283" y="781" width="158" height="15" fill="#FFFFFF"/>
  <text x="362" y="792" font-size="11" fill="#37474F" text-anchor="middle">append(AssistantContent)</text>

  <line x1="275" y1="850" x2="102" y2="850" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <rect x="130" y="831" width="116" height="15" fill="#FFFFFF"/>
  <text x="188" y="842" font-size="11" fill="#6B7280" text-anchor="middle">ConversationResult</text>

  <text x="60" y="930" font-size="11.5" fill="#6B7280">说明：工具往返产生的「工具调用消息 + 工具结果消息」写回历史后回到装配步骤再次请求，直到响应不含工具调用。</text>
  <text x="60" y="946" font-size="11.5" fill="#6B7280">取消由贯穿请求的取消令牌触发；失败以结构化错误收尾。</text>
</svg>
