# Clara 的本地依赖栈：Milvus（语义记忆）+ codebase-memory-mcp（代码知识图谱）。
#
# 一次 up 起全套：docker compose up -d
# 只起图谱：    docker compose up -d codebase-memory-mcp
# 图谱的部署脚本 deploy\codebase-memory-mcp\install-docker.ps1 用的就是这个文件（只操作图谱那一个服务）。
#
# Milvus 采用「计算与存储分离」架构，本体只做向量计算，元数据与数据分别外包给 etcd 与 MinIO，
# 因此 standalone 模式需要三个容器协同，依赖方向：
#   standalone ──► etcd   （元数据 / 协调，2379）
#              └►  minio  （对象存储，9000）
# 缺任何一个，Milvus 都无法启动；向量数据实际落在 MinIO，元数据落在 etcd，Milvus 本身无状态。
#
# 启动：docker compose up -d
# 停止：docker compose down（保留 ./volumes 数据）
services:
  # etcd：元数据与协调存储。
  # 存集合 schema、segment 信息、channel 检查点、节点注册等强一致 KV 数据，为 Milvus 提供集群元数据。
  # 仅供 Milvus 内部访问（2379 未对外暴露端口）。
  etcd:
    container_name: clara-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # minio：S3 兼容的对象存储。
  # 存向量数据、索引文件、binlog（真正的数据都落在这里），使 Milvus 可以无状态重启。
  # 9000 为 S3 API（Milvus 使用），9001 为 Web 控制台（浏览器人工查看，账号 minioadmin/minioadmin）。
  minio:
    container_name: clara-milvus-minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API：Milvus 读写数据
      - "9001:9001"   # Web 控制台：http://localhost:9001
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # standalone：Milvus 引擎本体（单机模式）。
  # 将协调器 / 查询节点 / 数据节点 / 索引节点 / 代理合并进一个进程，是本部署唯一对外提供服务的容器。
  # 19530 为 gRPC 服务端口（业务代码与集成测试连接的地址）；9091 为 metrics / 健康检查端口。
  # 本身不持久化数据，依赖 etcd（元数据）与 minio（数据）。
  standalone:
    container_name: clara-milvus-standalone
    image: milvusdb/milvus:v2.5.8
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379   # 元数据后端
      MINIO_ADDRESS: minio:9000   # 对象存储后端
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC：业务 / 联测入口
      - "9091:9091"     # metrics / 健康检查
    depends_on:
      - etcd    # 元数据存储
      - minio   # 对象存储

  # codebase-memory-mcp：代码知识图谱（读代码时优先查它，见 deploy/codebase-memory-mcp/readme.md）。
  # 为什么常驻而不是按需 run：该服务端只讲 stdio，而 stdio 跨不了容器边界；于是容器保持常驻，
  # 宿主按需用 `docker exec -i clara-codebase-memory-mcp codebase-memory-mcp` 把标准输入输出接进去
  # （这条命令同时就是 config/mcp/mcp.json 的注册项）。图谱 UI 走 HTTP，见下面 ports。
  codebase-memory-mcp:
    build:
      # 构建上下文还是放在 deploy/codebase-memory-mcp（Dockerfile 与 .build 产物都在那边）。
      context: ./codebase-memory-mcp
      args:
        BASE_IMAGE: ${CBM_BASE_IMAGE:-alpine:3.20}
        CBM_ARCHIVE: ${CBM_ARCHIVE:-codebase-memory-mcp-linux-amd64-portable.tar.gz}
    image: clara/codebase-memory-mcp:${CBM_VERSION:-v0.11.0}
    container_name: clara-codebase-memory-mcp
    # 保活：真正的图谱进程由 `docker exec -i` 按需拉起。busybox 的 sleep 认 infinity。
    command: ["sleep", "infinity"]
    environment:
      # 图谱数据目录，对应下面的命名卷；不要改，改了要在 .env 里同步。
      CBM_CACHE_DIR: /data
      # 图谱可视化 UI 的端口（容器内与宿主侧都用它，见 ports 的说明）。
      CBM_UI_PORT: ${CBM_UI_PORT:-9749}
    # 只发布到宿主回环：本机浏览器打开 http://127.0.0.1:<端口>/ 看图谱，局域网访问不到。
    # 端口号必须与容器内一致（UI 会校验 Host 是回环地址，换端口转发会被 403）。
    ports:
      - "127.0.0.1:${CBM_UI_PORT:-9749}:${CBM_UI_PORT:-9749}"
    volumes:
      # 图谱 SQLite 持久化：容器重建不丢图谱，删卷即清空全部索引。
      - cbm-data:/data
      # 待分析仓库 / 工作区：容器内固定 /work/repo，只读挂载（建索引只读文件，写的是 /data）。
      # 挂载点刻意放在普通目录下而不是顶层卷根：图谱拒绝把卷顶层（如 /repo）当项目根。
      # CLARA_CBM_REPO 由 install-docker.ps1 写进 deploy\codebase-memory-mcp\.env（--env-file 传入）；
      # 它可以是某个仓库，也可以是工作区根（工作目录的祖先），后者让一个容器覆盖多个项目。
      - ${CLARA_CBM_REPO:-..}:/work/repo:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "codebase-memory-mcp", "--version"]
      interval: 60s
      timeout: 10s
      start_period: 5s
      retries: 3

  # attu：Milvus 官方 Web 控制台（人工查看集合与实体数据）。
  # 只是 Milvus 的图形客户端，不参与存储；容器内通过 compose 网络直连 standalone 的 gRPC 19530。
  # 9601 为浏览器访问端口（http://localhost:9601）。
  attu:
    container_name: clara-milvus-attu
    image: zilliz/attu:v2.5
    environment:
      MILVUS_URL: standalone:19530   # compose 网络内直连 Milvus 服务名
    ports:
      - "9601:3000"   # Web 控制台：http://localhost:9601
    depends_on:
      - standalone   # 依赖 Milvus 服务本体

# 命名卷：钉住图谱数据卷的名字，让「并入本文件前后」用的是同一个卷（已有图谱不用重新索引）。
volumes:
  cbm-data:
    name: clara-codebase-memory-mcp_cbm-data
