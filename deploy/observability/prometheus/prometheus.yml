global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Clara 进程内的 /metrics 端点。Docker Desktop（Windows / macOS）通过
  # host.docker.internal 访问宿主机；Linux 由 compose 的 extra_hosts 映射。
  - job_name: clara
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          instance: clara-local

  # OpenTelemetry Collector 自身指标，用于观察导出队列与接收量。
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]